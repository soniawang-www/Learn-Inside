<style id="zhili-theme">
/* learn-inside 统一风格：纸色底、深青、少量粉；标题用宋体 */
:root{--bg:#F6F4EE;--card:#FFFFFF;--ink:#18302A;--soft:#5E726C;--line:#E4E0D6;--jade:#1D5C4D;--jade-soft:#E3ECE7;--plum:#B04A6F;--plum-soft:#F6E7EC;--warn:#A85A2A;--warn-soft:#F6E9DD;
 --display:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC",sans-serif;
 --kai:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC",sans-serif;
 --lg-jade:#2E8B74;--lg-sub:#4E6A62;--lg-ink:#18302A}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--bg:#121C19;--card:#1A2723;--ink:#E8EFEA;--soft:#9DB0A9;--line:#2B3B36;--jade:#6CC2A6;--jade-soft:#1E352F;--plum:#F29BBB;--plum-soft:#3E2630;--warn:#E3A274;--warn-soft:#3A2B1F;--lg-jade:#7FD1B6;--lg-sub:#A9C9BE;--lg-ink:#FFFFFF} }
:root[data-theme="dark"]{--bg:#121C19;--card:#1A2723;--ink:#E8EFEA;--soft:#9DB0A9;--line:#2B3B36;--jade:#6CC2A6;--jade-soft:#1E352F;--plum:#F29BBB;--plum-soft:#3E2630;--warn:#E3A274;--warn-soft:#3A2B1F;--lg-jade:#7FD1B6;--lg-sub:#A9C9BE;--lg-ink:#FFFFFF}
.lg-sub{fill:var(--lg-sub)}
/* 收一点可爱感：细边、去掉按钮底下的厚影子 */
.player,.maintabs,.tabs,.tools{border-width:1.5px!important;box-shadow:0 1px 3px rgba(0,0,0,.05)!important}
.player{border-radius:18px}
.nx,.rb.play,.btn.go,.tp,.half{box-shadow:none!important}
.card{border-top-width:3px}
#home a.card{border-width:1.5px}
h1{font-weight:600;letter-spacing:.06em}
.seal{background:transparent!important;color:var(--plum)!important;border:1.5px solid currentColor;border-radius:3px;font-family:var(--display)!important;font-weight:600}
.lockup{gap:20px}
.lockup .col{gap:11px}
.lockup .col svg:last-child{margin-left:0}
.brandbar{gap:9px;margin:0 0 6px}
.brandbar .bdiv{width:1.5px;height:12px;background:var(--lg-sub);opacity:.45;flex:none}
/* 自适应：手机、平板、电脑和各种窗口大小 */
body{font-size:1rem}
@media (min-width:768px){html{font-size:17px}}
@media (min-width:1200px){html{font-size:18px}}
@media (min-width:1700px){html{font-size:19.5px}}
@media (min-width:768px){.wrap{max-width:880px}.pbar .in{max-width:848px}}
@media (min-width:1200px){.wrap{max-width:1020px}.pbar .in{max-width:988px}}
@media (min-width:1700px){.wrap{max-width:1140px}.pbar .in{max-width:1108px}}
@media (min-width:1000px){
 .qs,#poems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
 #home{max-width:960px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch}
 #home>:not(a.card){grid-column:1/-1}
 .chars8{max-width:760px}
}
</style>

<script>
function startApp(MODE){
const RAW = window.__FHL;
const G3S = MODE==='final' ? '红江无马年' : '小孩乐花秋月海水';
const DATA = MODE!=='full'
  ? {chars: [...G3S].map(c=>RAW.chars.find(x=>x[0]===c)).filter(Boolean), poems: RAW.poems, lines: RAW.lines.filter(l=>[...G3S].some(c=>l[0].includes(c)))}
  : RAW;
const RAWIDX = new Map(RAW.lines.map((l, i)=>[l[0], i]));
const SRC = ['课本精选','千家诗','唐诗三百首','宋词三百首','诗经','唐宋诗选'];
// 每句：[诗句, 作者, 出处, 意思, 来源等级]
const P = DATA.lines.map(l=>{ const m = DATA.poems[l[1]]; return [l[0], m[0], m[1], l[3]||'', l[2], l[1]]; });
const PBY = new Map(P.map(p=>[p[0], p]));
const dynOf = p => DATA.poems[p[5]][2];
const srcLine = p => (dynOf(p)?'〔'+dynOf(p)+'〕':'')+p[1]+'《'+p[2]+'》';
const CH = DATA.chars; // [字, 拼音, 句数]
const $ = id => document.getElementById(id);
const norm = s => s.replace(/[^一-鿿]/g,'');
const plain = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ü/g,'v');
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};
let done = new Set(store.get('fhl-done', []));
const CURKEY = MODE==='final' ? 'fhlf-cur' : MODE==='g3' ? 'fhl3-cur' : 'fhl-cur';
let cur = store.get(CURKEY, '花');
if(!CH.some(c=>c[0]===cur)) cur = CH.some(c=>c[0]==='花') ? '花' : CH[0][0];
const poolCache = {};
const pool = c => poolCache[c] || (poolCache[c] = P.filter(p=>p[0].includes(c)).sort((a,b)=>a[4]-b[4]));
$('sub').textContent = MODE==='final'
  ? '红 2022 · 江 无 2023 · 马 年 2025'
  : MODE==='g3'
  ? '三年级备赛专用：小、孩、乐、花、秋、月、海、水，共 8 个字。点下面的字切换。'
  : '';
$('sub').hidden = !$('sub').textContent;
$('back').onclick = e=>{ e.preventDefault(); goHome(); };
{ const seal = MODE==='final' ? '总决选' : MODE==='g3' ? '备赛版' : '诗词馆'; const s = document.querySelector('#app .seal'); s.setAttribute('aria-label', seal); s.innerHTML = [...seal].map(c=>'<span>'+c+'</span>').join(''); }
// 备赛版：只有 8 个字，直接点字切换，不用拼音索引
function renderChars8(){
  if(MODE==='full') return;
  const box = $('chars8'); box.hidden = false; box.textContent = '';
  CH.forEach(c=>{
    const list = pool(c[0]), k = list.filter(p=>done.has(p[0])).length;
    const b = document.createElement('button'); b.setAttribute('aria-pressed', c[0]===cur);
    b.setAttribute('aria-label', c[0]+' '+c[1]+'，会背 '+k+' 句，共 '+list.length+' 句');
    b.innerHTML = '<span class="z"></span><span class="n"></span>';
    b.children[0].textContent = c[0]; b.children[1].textContent = k+'/'+list.length;
    b.onclick = ()=>choose(c[0]);
    box.appendChild(b);
  });
}
if(MODE!=='full'){ $('nowCard').hidden = true; $('index').hidden = true; }

// 背一背的朗读：手指点按钮时直接发声，不受比赛页“语音自动播放”开关影响
let readingBtn = null;

const ICON_SPK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.6v12.8l-4.8-3.9H4z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path class="w1" d="M15.2 9.2a4 4 0 0 1 0 5.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path class="w2" d="M17.8 6.6a7.6 7.6 0 0 1 0 10.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>';
function setRead(btn, on){
  btn.classList.toggle('on', on);
  btn.innerHTML = ICON_SPK + '<span></span>';
  btn.lastChild.textContent = on ? '停止' : (btn.dataset.label || '朗读');
  btn.setAttribute('aria-pressed', on);
}
function readAloud(text, btn){
  if(!('speechSynthesis' in window)){ btn.textContent = '这个浏览器不能朗读'; return; }
  try{
    const again = readingBtn === btn;
    speechSynthesis.cancel();
    if(readingBtn){ setRead(readingBtn, false); readingBtn = null; }
    if(again) return;
    const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-CN'; u.rate = .8;
    const zh = speechSynthesis.getVoices().find(v=>/^(zh|cmn)/i.test(v.lang)); if(zh) u.voice = zh;
    u.onend = u.onerror = ()=>{ if(readingBtn===btn){ setRead(btn, false); readingBtn = null; } };
    readingBtn = btn; setRead(btn, true);
    speechSynthesis.resume(); speechSynthesis.speak(u);
  }catch(e){}
}
function lineEl(text, c, hideFrom){
  const p = document.createElement('p'); p.className = 'ln';
  let n = 0;
  for(const ch of text){
    const isHan = /[一-鿿]/.test(ch);
    const el = document.createElement(ch===c ? 'b' : 'span');
    el.textContent = ch;
    if(hideFrom!=null && isHan && n>=hideFrom) el.classList.add('hid');
    if(isHan) n++;
    p.appendChild(el);
  }
  return p;
}

  if(!L.childElementCount){
    const all = [...new Set(CH.map(c=>plain(c[1])[0].toUpperCase()))];

      const b = document.createElement('button'); b.textContent = x; b.dataset.l = x==='全部'?'':x.toLowerCase();

/* ---------- 和外层页面通信：在线时由外层调用下载、AI 讲解 ---------- */
const BR = {ok:false, viewer:false, downloads:false, sample:false, seq:0, wait:{}};
function onCaps(){}
(async()=>{
  const C = window.claude;
  if(!C || !C.use) return;
  BR.viewer = true; onCaps();
  const [dl, sm] = await Promise.all([C.use('downloads').catch(()=>null), C.use('sample').catch(()=>null)]);
  BR.dl = dl; BR.sm = sm; BR.downloads = !!dl; BR.sample = !!sm; BR.ok = true; onCaps();
})();
async function bridgeCall(msg, onText){
  try{
    if(msg.fhl === 'save'){ if(!BR.dl) return {ok:false, code:'unavailable'}; await BR.dl.save({filename:msg.filename, data:msg.data}); return {ok:true}; }
    if(msg.fhl === 'ask'){ if(!BR.sm) return {ok:false, code:'unavailable'}; const r = await BR.sm(msg.prompt, {onText:({text})=>onText && onText(text), cache:{gcTime:86400000}}); return {ok:true, text:r.text}; }
  }catch(err){ return {ok:false, code:err && err.code, text:err && err.text}; }
  return {ok:false, code:'unavailable'};
}

const PROSE = {'论语':1,'岳阳楼记':1,'桃花源记':1,'孟子·尽心上':1};
function fullLines(txt){
  if(txt.includes('\n')) return txt.split('\n').filter(Boolean);
  return (txt.match(/[^。！？；]+[。！？；]?/g) || []).map(s=>s.trim()).filter(Boolean);
}
let askCtl = 0;
function openPoem(p){
  const poem = DATA.poems[p[5]], c = cur;
  $('shTitle').textContent = '《'+poem[1]+'》';
  $('shMeta').textContent = (poem[2]?'〔'+poem[2]+'〕':'')+poem[0];
  const F = $('shFull'); F.textContent = '';
  const full = poem[3];
  const target = norm(p[0]);
  if(!full){
    F.appendChild(lineEl(p[0], c));
    const n = document.createElement('p'); n.className='muted'; n.style.marginTop='6px';
    n.textContent = PROSE[poem[1]] ? '这一句出自文章《'+poem[1]+'》，不是一首诗，这里只收了这一句。' : '诗库里暂时没有这首诗的全文。';
    F.appendChild(n);
  } else {
    fullLines(full).forEach(s=>{
      const el = lineEl(s, c); const ns = norm(s);
      if(ns && (target.includes(ns) || ns.includes(target))) el.classList.add('hit');
      F.appendChild(el);
    });
  }
  const rb = $('shRead'); if(readingBtn===rb) readingBtn = null; setRead(rb, false);
  rb.onclick = ()=>readAloud(poem[1]+'。'+(poem[2]?poem[2]+'，':'')+poem[0]+'。'+(full || p[0]), rb);
  const E = $('shExp'); E.textContent = ''; askCtl++;
  if(poem[4]){ const x = document.createElement('p'); x.className='exp'; x.textContent = poem[4]; E.appendChild(x); }
  else if(!full){ const x = document.createElement('p'); x.className='exp'; x.textContent = p[3] || '暂无解释。'; E.appendChild(x); }
  else if(BR.sample){
    if(p[3]){ const x = document.createElement('p'); x.className='muted'; x.textContent = '这一句的意思：'+p[3]; E.appendChild(x); }
    const b = document.createElement('button'); b.className='btn ghost'; b.textContent='请 AI 讲一讲这首诗';
    const out = document.createElement('p'); out.className='exp';
    const my = askCtl;
    b.onclick = async ()=>{
      b.disabled = true; out.textContent = '正在思考……第一次使用时，会先请你允许。';
      const prompt = '请用小学生能听懂的白话，按顺序把下面这首古诗词的意思讲清楚，最后用一句话说说这首诗表达了什么。200 字以内，不要用 Markdown 格式，不要加标题。\n\n题目：《'+poem[1]+'》\n作者：'+(poem[2]?poem[2]+'·':'')+poem[0]+'\n全文：'+full;
      const r = await bridgeCall({fhl:'ask', prompt}, text=>{ if(my===askCtl) out.textContent = text; });
      if(my!==askCtl) return;
      if(r.ok){ out.textContent = r.text; b.remove(); }
      else { b.disabled = false; out.textContent = r.text || (r.code==='not_granted' ? '没有获得使用 AI 的许可。' : r.code==='rate_limited' ? 'AI 现在太忙了，等一会儿再试。' : 'AI 讲解暂时不可用，请稍后再试。'); }
    };
    E.append(b, out);
  } else {
    const x = document.createElement('p'); x.className='muted';
    x.textContent = (p[3] ? '这一句的意思：'+p[3]+'\n' : '') + '暂无全文解释。';
    x.style.whiteSpace='pre-wrap'; E.appendChild(x);
  }
  $('sheet').hidden = false; $('sheet').querySelector('.panel').scrollTop = 0;
}

const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(s, c){ return esc(s).split(c).join('<b>'+c+'</b>'); }
function blank(s, c){
  let n = 0; let out = '';
  for(const ch of s){
    if(/[一-鿿]/.test(ch)){ out += (n<2 || ch===c) ? (ch===c?'<b>'+ch+'</b>':esc(ch)) : '<i>　</i>'; n++; }
    else out += esc(ch);
  }
  return out;
}

let G = null, level = 8, lvR = 1, pending = '';
// 每句限时（总决选版默认 10 秒）：轮到我时开始倒数，最后 3 秒响提示音，到 0 算输

let tT = null, tLeft = 0, actx = null;
function beep(f){ try{ if(!actx) return; const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; o.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(.18, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+.2); o.start(); o.stop(actx.currentTime+.22); }catch(e){} }
function stopClock(){ clearInterval(tT); tT = null; $('tClock').hidden = true; }
function startClock(){
  stopClock(); const lim = +$('tLimit').value; if(!lim || !G || G.over) return;
  tLeft = lim; $('tClock').hidden = false; $('tClock').classList.remove('low'); $('tSec').textContent = tLeft;
  tT = setInterval(()=>{
    tLeft--; $('tSec').textContent = Math.max(tLeft, 0);
    if(tLeft <= 3 && tLeft > 0){ $('tClock').classList.add('low'); beep(880); }
    if(tLeft <= 0){ stopClock(); beep(330); say('sys','时间到！'+lim+' 秒内没有接上。'); end(false); }
  }, 1000);
}
$('levels').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  level = +b.dataset.n; lvR = +b.dataset.r;
  $('levels').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b));
});
function resetGame(){
  stopClock(); G = null; $('ruleChar').textContent = cur;
  $('setup').hidden = false; $('play').hidden = true;
}
function say(who, text, isLine, extra){
  const m = document.createElement('div'); m.className = 'msg '+who;
  if(who!=='sys'){ const w=document.createElement('div'); w.className='who'; w.textContent = who==='me'?'我':G.name; m.appendChild(w); }
  if(isLine && who==='pc'){ m.style.cursor='pointer'; m.onclick=()=>speak(text); }
  if(isLine) m.appendChild(lineEl(text, G.c)); else m.appendChild(document.createTextNode(text));
  if(extra){ const e=document.createElement('div'); e.className='meta'; e.textContent=extra; m.appendChild(e); }
  $('log').appendChild(m); $('log').scrollTop = $('log').scrollHeight;
}
function speak(text){
  if(!$('ttsOn').checked || !('speechSynthesis' in window)) return;
  try{
    const u = new SpeechSynthesisUtterance(text); u.lang='zh-CN'; u.rate=.85;
    const vs = speechSynthesis.getVoices(), zh = vs.find(v=>/^(zh|cmn)/i.test(v.lang));
    if(zh) u.voice = zh;
    else if(vs.length && !speak.warned){ speak.warned = true; say('sys','这台设备没有装中文朗读，机器人可能读不出声音。'); }
    if(speechSynthesis.speaking) speechSynthesis.cancel();
    speechSynthesis.resume(); speechSynthesis.speak(u);
  }catch(e){}
}
// 手机浏览器要求第一次发声必须发生在手指点击里，所以在点按钮时先“静音读”一次来解锁
function unlockTTS(){
  if(!('speechSynthesis' in window)){ if(!speak.warned && G){ speak.warned=true; say('sys','这个浏览器不支持朗读，机器人读不出声音。'); } return; }
  try{ speechSynthesis.getVoices(); const u = new SpeechSynthesisUtterance(' '); u.volume=0; u.lang='zh-CN'; speechSynthesis.speak(u); }catch(e){}
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
const MOBILE = /Android|iPhone|iPad|iPod|HarmonyOS|Mobile/i.test(navigator.userAgent) || (window.matchMedia && matchMedia('(pointer:coarse)').matches);
const MIC_LABEL = MOBILE ? '点这里，用键盘话筒说诗句' : '按一下，说诗句';
$('micBtn').textContent = MIC_LABEL;
// 手机上网页自己听不了声音，改用输入法的话筒：说完文字进输入框，对上诗库就自动提交
function micFail(){
  $('answer').focus();
  $('tip').textContent='请点键盘上的话筒键，说出诗句，说完会自动提交。';
}
let autoT = null;
$('answer').addEventListener('input', ()=>{
  clearTimeout(autoT);
  autoT = setTimeout(()=>{
    if(!G || G.over || $('answer').disabled) return;
    const t = norm($('answer').value);
    if(!t.includes(G.c)) return;
    const hit = pool(G.c).find(p=> !G.used.has(p[0]) && (norm(p[0])===t || p[0].split(/[，。？！、；]/).some(c=>norm(c)===t)));
    if(hit) $('entry').requestSubmit();
  }, 1200);
});
$('micBtn').onclick = ()=>{
  if(!G || G.over) return;
  if(rec){ rec.stop(); return; }
  if(!SR || MOBILE){ unlockTTS(); micFail(); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  $('tip').textContent='';
  rec = new SR(); rec.lang='zh-CN'; rec.interimResults=false; rec.maxAlternatives=5;
  $('micBtn').textContent='正在听，请说诗句……';
  rec.onresult = ev=>{
    const alts = Array.from(ev.results[0]).map(a=>a.transcript);
    const good = alts.find(a=>{ const t=norm(a); return t.includes(G.c) && findEntry(t); }) || alts[0];
    $('answer').value = good; $('entry').requestSubmit();
  };
  rec.onerror = ev=>{ if(ev.error==='no-speech'||ev.error==='aborted') $('tip').textContent='没听清，再按一下说一次。'; else micFail(); };
  rec.onend = ()=>{ rec=null; $('micBtn').textContent=MIC_LABEL; };
  try{ rec.start(); }catch(e){ rec=null; $('micBtn').textContent=MIC_LABEL; micFail(); }
};
function lock(v){ $('micBtn').disabled=v; $('answer').disabled=v; $('hintBtn').disabled=v; $('giveBtn').disabled=v; }
function score(){ $('sMe').textContent=G.me; $('sPc').textContent=G.pc;  }

$('startBtn').onclick = ()=>{
  let base = pool(cur).filter(p=>p[4]<=lvR); if(base.length < Math.min(level, 5)) base = pool(cur);
  const all = base.slice().sort(()=>Math.random()-.5);
  const name = level===8?'小书童':level===30?'小秀才':'大诗人';
  G = { c:cur, name, known: all.slice(0, level), used:new Set(), usedExtra:new Set(), me:0, pc:0, hints:3, over:false };
  $('setup').hidden = true; $('play').hidden = false;
  $('log').textContent=''; $('result').hidden=true; $('againBtn').hidden=true; $('judge').hidden=true; $('tip').textContent='';
  $('pcName').textContent = name+'说了';
  say('sys','今天的字是“'+cur+'”。你先说！机器人说的句子，点一下可以再听一遍。');
  unlockTTS();
  try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); }catch(e){}
  $('hintBtn').textContent='提示'; score(); lock(false); $('answer').value=''; $('answer').focus(); startClock();
};
$('againBtn').onclick = resetGame;

function findEntry(t){
  return pool(G.c).find(p=>{
    const full = norm(p[0]);
    return full===t || full.includes(t) && t.length>=4;
  });
}
$('entry').onsubmit = e=>{
  e.preventDefault();
  if(!G || G.over) return;
  const raw = $('answer').value.trim(), t = norm(raw);
  $('tip').textContent='';
  if(t.length<4){ $('tip').textContent='再多写几个字，至少写完整的一句。'; return; }
  const hit = findEntry(t);
  if(!t.includes(G.c)){
    $('tip').textContent = hit ? '这首诗是对的，不过要说带“'+G.c+'”字的那一句哦。' : '这句里没有“'+G.c+'”字，再想一句。';
    return;
  }
  if(hit){
    if(G.used.has(hit[0])){ $('tip').textContent='这句已经说过了，换一句。'; return; }
    accept(hit[0], hit[1]+'《'+hit[2]+'》', hit[0]);
  }else{
    if(G.usedExtra.has(t)){ $('tip').textContent='这句已经说过了，换一句。'; return; }
    pending = raw; stopClock(); $('judge').hidden=false; lock(true);
  }
};
$('judgeYes').onclick = ()=>{ $('judge').hidden=true; G.usedExtra.add(norm(pending)); accept(pending, '', null); };
$('judgeNo').onclick = ()=>{ $('judge').hidden=true; lock(false); $('answer').focus(); startClock(); };

function accept(text, src, key){
  stopClock();
  if(key) G.used.add(key);
  G.hint = null; $('hintBtn').textContent='提示';
  G.me++; say('me', text, true, src); score();
  $('answer').value=''; lock(true);
  setTimeout(pcTurn, 900);
}
function pcTurn(){
  const left = G.known.filter(p=>!G.used.has(p[0]));
  if(!left.length){ say('pc','嗯……我想不出来了。'); speak('我想不出来了，你赢了'); return end(true); }
  const p = left[Math.floor(Math.random()*left.length)];
  G.used.add(p[0]); G.pc++;
  if(G.hint && G.hint[0]===p[0]){ G.hint = null; $('hintBtn').textContent='提示'; }
  say('pc', p[0], true, p[1]+'《'+p[2]+'》'); score(); speak(p[0]);
  lock(false); $('answer').focus(); startClock();
}
$('hintBtn').onclick = ()=>{
  // 第一次：给作者、诗名和开头三个字；再点一次：直接给出整句答案
  if(G.hint && !G.used.has(G.hint[0])){
    const p = G.hint;
    $('tip').textContent = '答案：'+p[0]+'（'+p[1]+'《'+p[2]+'》）'+(p[3]?' 意思是：'+p[3]:'')+' 跟着说一遍，就算你的。';
    speak(p[0]); $('hintBtn').textContent='提示'; G.hint = null; lock(false); return;
  }
  const left = pool(G.c).filter(p=>!G.used.has(p[0]));
  if(!left.length){ $('tip').textContent='诗库里的句子都说完了，只能靠你自己想啦。'; return; }
  const easy = left.slice(0, 15), p = easy[Math.floor(Math.random()*easy.length)];
  G.hint = p; lock(false);
  $('tip').textContent = '提示：'+p[1]+'的《'+p[2]+'》，开头是“'+norm(p[0]).slice(0,3)+'……”';
  $('hintBtn').textContent = '还是想不起来？看答案';
};
$('giveBtn').onclick = ()=>{ say('sys','你说：我接不上了。'); end(false); };
function end(win){
  stopClock(); G.over = true; lock(true); $('hintBtn').disabled=true;
  const left = pool(G.c).filter(p=>!G.used.has(p[0]));
  $('result').hidden=false; $('againBtn').hidden=false;
  $('result').textContent = win ? '你赢了！一共说出 '+G.me+' 句。' : G.name+'赢了。你说出了 '+G.me+' 句，再练练就能赢。';
  if(!win && left.length){
    say('sys','还可以说这些：');
    left.slice(0,3).forEach(p=>say('sys', p[0]+'（'+p[1]+'）'));
  }
}

renderNow(); renderChars8(); renderIndex(); renderPrep(); resetGame(); togglePicker(false, true); setRead($('shRead'), false);
if(window.__fhlPrint){ const t = window.__fhlPrint; window.__fhlPrint = null; setTimeout(()=>applyPrintToken(t), 50); }
}
</script>

<script>
// 目录页：点卡片进入版本；返回目录时只是切换显示，换另一个版本时重新加载
let STARTED = null;
function openV(m){
  if(m==='final' && window.__FHL_LOCKFINAL){ const g = document.querySelector('.fh-gate'); if(g){ g.scrollIntoView({block:'center'}); g.classList.add('flash'); setTimeout(()=>g.classList.remove('flash'), 1200); } return; }
  if(STARTED && STARTED !== m){ location.hash = m; location.reload(); return; }
  document.getElementById('home').hidden = true; document.getElementById('app').hidden = false;
  document.body.classList.remove('home');
  if(!STARTED){ STARTED = m; startApp(m); }
  try{ history.replaceState(null, '', '#'+m); }catch(e){}
  window.scrollTo(0, 0);
}
function goHome(){
  document.getElementById('app').hidden = true; document.getElementById('home').hidden = false;
  document.body.classList.add('home');
  try{ speechSynthesis.cancel(); }catch(e){}
  try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
  window.scrollTo(0, 0);
}
document.querySelectorAll('#home a[data-v]').forEach(a=>a.addEventListener('click', e=>{ e.preventDefault(); openV(a.dataset.v); }));
document.body.classList.add('home');
// 语文会员版：诗库从服务器取（会员全部，不是会员只开放一个字试用）；没登录直接建游客
(async () => {
  const ls = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  let tok = ls('li.token');
  const login = () => { try { localStorage.setItem('li.back', JSON.stringify(location.pathname + location.hash)); } catch (e) {} location.replace('/account/'); };
  if (!tok && ls('li.hadAccount')) return login();
  if (!tok) { // 第一次来：直接建游客，先试起来
    try {
      const g = await (await fetch('/api/auth/guest', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' })).json();
      if (!g.token) throw 0;
      localStorage.setItem('li.token', JSON.stringify(g.token)); localStorage.setItem('li.student', JSON.stringify(g.student)); tok = g.token;
    } catch (e) { return login(); }
  }
  let j;
  try {
    const r = await fetch('/api/chinese/feihua', { headers: { authorization: 'Bearer ' + tok } });
    if (r.status === 401) return login();
    j = await r.json();
    if (!r.ok) throw new Error(j.error || '加载失败');
  } catch (e) {
    document.body.classList.remove('net-wait');
    document.getElementById('home').insertAdjacentHTML('afterbegin', '<p class="fh-gate">诗库加载失败，请刷新再试。</p>'); return;
  }
  document.body.classList.remove('net-wait');
  window.__FHL = j.data;
  window.__FHL_LOCKFINAL = !j.member;
  if (!j.member) document.querySelector('a[data-v="final"] .pill').textContent = '语文会员';
  // 会背记录：和账号里的合并（两边都算会背），之后每点一次「我会背了」都同步到账号
  const sid = (() => { try { return JSON.parse(localStorage.getItem('li.student') || 'null')?.id; } catch (e) { return null; } })();
  if (sid) {
    const H = { authorization: 'Bearer ' + tok, 'content-type': 'application/json' };
    const post = (b) => fetch('/api/chinese/feihua/done', { method: 'POST', headers: H, body: JSON.stringify({ student_id: sid, ...b }) }).catch(() => {});
    try {
      const r = await fetch('/api/chinese/feihua/done?student=' + encodeURIComponent(sid), { headers: H });
      if (r.ok) {
        const srv = new Set((await r.json()).lines || []);
        let local = []; try { local = JSON.parse(localStorage.getItem('fhl-done') || '[]'); } catch (e) {}
        const up = local.filter((x) => !srv.has(x));
        if (up.length) post({ add: up });
        localStorage.setItem('fhl-done', JSON.stringify([...new Set([...srv, ...local])]));
      }
    } catch (e) {}
    window.__fhlSync = (line, on) => post(on ? { add: [line] } : { remove: [line] });
  }
  if (!j.member) document.getElementById('home').insertAdjacentHTML('afterbegin',
    `<div class="fh-gate"><b>语文会员专享</b><span>现在可以试「${j.sample}」字</span><a href="/account/">开通语文会员</a></div>`);
  const h = location.hash.slice(1); const pm = /^print-(g3|full|final)-/.exec(h);
  if(pm){ window.__fhlPrint = h; openV(pm[1]); } else if(h === 'full' || h === 'final') openV(h);
})();
</script>

</body></html>
