<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<title>打印 · learn-inside 语文</title>
<style>html,body{margin:0;background:#EDEAE2;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.msg{max-width:520px;margin:60px auto;padding:0 20px;color:#5D6A65;line-height:1.7;text-align:center}.msg a{color:#1D5C4D}</style>
</head>
<body>
<p class="msg" id="msg">正在准备…</p>
<script type="module">
// 打印链接页（不用登录，篇目和卡片都是公开的）：
//   #p=篇目号,…&x=选项          古诗（旧链接 #p=…&v=study|blank|hint&o=mna&k=1 也认）
//   #c=卡片 id,…                 诗人卡、常识卡
//   #t=打印凭证                  语文卷子、语文错题（要凭证：卷子和错题不公开）
import { openPoemPrint, openCardPrint, openCnExamPrint, openCnMistakesPrint, unpackOpts } from './print-tpl.js?v=20261111';
const H = new URLSearchParams(location.hash.slice(1));
const ids = (k) => (H.get(k) || '').split(',').filter(Boolean);
const msg = (t) => { document.getElementById('msg').innerHTML = t; };
(async () => {
  try {
    if (H.get('t')) {
      const r = await fetch(`/api/print/${encodeURIComponent(H.get('t'))}`); const d = await r.json();
      if (!r.ok) throw new Error(d.error || '打印链接已失效');
      if (!d.items?.length) throw new Error('没有要打印的题目');
      msg('');
      if (d.cn_exam) return openCnExamPrint({ exam: d.exam, items: d.items, standalone: true, home: '/chinese/', link: async () => location.href });
      return openCnMistakesPrint({ title: d.title, presets: [{ label: `这次的 ${d.items.length} 题`, ids: () => d.items.map((x) => x.problem_id) }],
        fetch: async () => d.items, opts: { ans: !!d.with_ans }, standalone: true, home: '/chinese/#/mistakes', link: async () => location.href });
    }
    if (H.get('c')) {
      const all = (await (await fetch('/api/chinese/cards')).json()).items || [];
      const want = ids('c').filter((id) => all.some((c) => c.id === id));
      if (!want.length) throw new Error('没有找到要打印的卡片');
      msg('');
      return openCardPrint({ cards: all, standalone: true, home: '/chinese/#/cards', presets: [{ label: `这次的 ${want.length} 张`, ids: () => want }] });
    }
    const all = (await (await fetch('/api/chinese/poems')).json()).items || [];
    const want = ids('p').filter((x) => all.some((p) => String(p.idx) === x));
    if (!want.length) throw new Error('没有找到要打印的篇目');
    let opts = unpackOpts(H.get('x'));
    if (H.get('v')) { const o = H.get('o') || ''; opts = { v: H.get('v'), m: o.includes('m'), n: o.includes('n'), a: o.includes('a'), k: H.get('k') === '1' }; }
    msg('');
    openPoemPrint({ poems: all, opts, standalone: true, home: '/chinese/#/beishi', presets: [{ label: `这次的 ${want.length} 篇`, ids: () => want }] });
  } catch (e) { msg(`${e.message}<br><a href="/chinese/">回到语文</a>`); }
})();
</script>
</body>
</html>
