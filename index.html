:root{
  --bg:#eaf3f1; --card:#ffffff; --ink:#1d2f3a; --soft:#5c7280; --line:#cfe0dc;
  --jade:#1f8a70; --jade-soft:#d6efe7; --plum:#c2377a; --plum-soft:#fbe3ee; --warn:#b3541e; --warn-soft:#fbe8da;
  --display:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
  --kai:"Kaiti SC","STKaiti","KaiTi",serif;
  --en:"Nunito","PingFang SC","Microsoft YaHei",sans-serif;
  --body:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12201f; --card:#1b2c2b; --ink:#e8f1ee; --soft:#9db3ae; --line:#2f4644;
  --jade:#5fd0b0; --jade-soft:#1f3d37; --plum:#ff8fc0; --plum-soft:#47253a; --warn:#ffb07a; --warn-soft:#472c1a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12201f; --card:#1b2c2b; --ink:#e8f1ee; --soft:#9db3ae; --line:#2f4644;
  --jade:#5fd0b0; --jade-soft:#1f3d37; --plum:#ff8fc0; --plum-soft:#47253a; --warn:#ffb07a; --warn-soft:#472c1a; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 64px;padding-top:calc(20px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:400;font-size:2.3rem;margin:0;letter-spacing:.1em;display:flex;align-items:center;gap:10px;line-height:1.2}
.seal{font-family:var(--kai);font-size:.85rem;letter-spacing:0;color:var(--card);background:var(--plum);border-radius:6px;padding:4px 0;width:1.9em;line-height:1.15;display:flex;flex-direction:column;align-items:center}
.sub{margin:0;color:var(--soft);font-family:var(--kai);font-size:1.05rem}
.en{font-family:var(--en);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--plum);outline-offset:2px}

/* 搜索 + 分类：吸顶 */
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border:2px solid var(--jade);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 12px -6px rgba(31,138,112,.35)}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:0 12px}
.search svg{flex:none;width:20px;height:20px;stroke:var(--soft)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1.05rem;padding:11px 0;outline:none}
.search input::placeholder{color:var(--soft)}
.clear{flex:none;width:28px;height:28px;border-radius:50%;color:var(--soft);font-size:1.1rem;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;padding:5px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-family:var(--display);font-size:1.02rem;letter-spacing:.04em;min-height:38px}
.chip small{font-family:var(--en);font-size:.8rem;color:var(--soft)}
.chip[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:var(--card)}
.chip[aria-pressed="true"] small{color:var(--card)}

.meta{display:flex;justify-content:space-between;align-items:baseline;color:var(--soft);font-size:.9rem;padding:0 4px}

/* 分组 + 卡片 */
.group{display:flex;flex-direction:column;gap:10px}
.gh{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:6px 4px 0;color:var(--jade);letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.gh .dot{width:10px;height:10px;border-radius:50%;background:currentColor}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;border-top:6px solid var(--jade)}
.card[data-cat="chinese"]{border-top-color:var(--plum)}
.card[data-cat="math"]{border-top-color:var(--warn)}
.card h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.35rem;letter-spacing:.04em;line-height:1.3}
.card h3 a{color:inherit;text-decoration:none}
.card p{margin:0;color:var(--soft);font-family:var(--kai);font-size:1rem;line-height:1.6;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.78rem;padding:1px 10px;border-radius:999px;background:var(--jade-soft);color:var(--jade)}
.card[data-cat="chinese"] .tag.cat{background:var(--plum-soft);color:var(--plum)}
.card[data-cat="math"] .tag.cat{background:var(--warn-soft);color:var(--warn)}
.path{font-family:var(--en);font-weight:600;font-size:.8rem;color:var(--soft);word-break:break-all}
.acts{display:flex;gap:8px;margin-top:2px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border-radius:999px;font-family:var(--display);font-size:1.02rem;letter-spacing:.04em;min-height:42px;text-decoration:none}
.btn.go{background:var(--jade);color:var(--card);box-shadow:0 3px 0 var(--jade-soft)}
.btn.cp{background:transparent;color:var(--plum);border:2px solid var(--plum)}
.btn.cp.done{background:var(--plum);color:var(--card)}
.btn:active{transform:translateY(2px)}
mark{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:0 2px}

.empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:28px 16px;text-align:center;color:var(--soft)}
.empty b{display:block;font-family:var(--display);font-weight:400;font-size:1.3rem;color:var(--ink);margin-bottom:4px}

.foot{border-top:1px dashed var(--line);padding-top:12px;color:var(--soft);font-size:.85rem;display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between}
.theme{color:var(--jade);font-size:.85rem;text-decoration:underline}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.95rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.linkbox{margin-top:4px;padding:6px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-family:var(--en);font-size:.82rem;word-break:break-all;user-select:all;-webkit-user-select:all}
@media (max-width:420px){h1{font-size:1.9rem}}
@media (prefers-reduced-motion: reduce){.toast{transition:none}.btn:active{transform:none}}

/* 导航：顶栏、数学入口、科目 */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.who{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:.92rem;text-decoration:none;white-space:nowrap;max-width:15em;overflow:hidden;text-overflow:ellipsis}
.pill.me{border-color:var(--jade);color:var(--jade)}
.pill .av{flex:none;width:22px;height:22px;border-radius:50%;background:var(--jade);color:var(--card);display:grid;place-items:center;font-size:.75rem}
.portal{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:12px}
.feat{position:relative;display:flex;flex-direction:column;gap:8px;padding:20px 22px;border-radius:20px;background:var(--jade);color:var(--card);text-decoration:none;overflow:hidden;min-width:0}
.feat::after{content:"";position:absolute;right:-50px;bottom:-60px;width:200px;height:200px;border-radius:50%;border:28px solid color-mix(in srgb,var(--card) 12%,transparent);pointer-events:none}
.feat-k{font-size:.9rem;letter-spacing:.08em;opacity:.85}
.feat-t{font-family:var(--display);font-weight:600;font-size:1.9rem;line-height:1.25;letter-spacing:.04em}
.feat-d{font-size:1rem;line-height:1.65;opacity:.92;max-width:30em}
.feat-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:6px;position:relative;z-index:1}
.feat-gift{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--card);color:var(--plum);font-size:.9rem;font-weight:600;white-space:nowrap}
.feat-go{display:inline-flex;align-items:center;padding:6px 16px;border-radius:999px;border:1.5px solid currentColor;font-family:var(--display);font-weight:600;white-space:nowrap}
.quick{display:grid;grid-template-rows:repeat(3,1fr);gap:10px;min-width:0}
.quick a{display:grid;grid-template-columns:minmax(0,1fr) auto;align-content:center;column-gap:10px;padding:12px 16px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);color:var(--ink);text-decoration:none;min-width:0}
.quick b{font-family:var(--display);font-weight:600;font-size:1.15rem;letter-spacing:.04em;white-space:nowrap}
.quick small{color:var(--soft);font-size:.85rem;min-width:0;grid-column:1}
.quick a::after{content:"›";color:var(--jade);font-size:1.3rem;line-height:1;grid-column:2;grid-row:1/3;align-self:center}
.subs{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.sub-t{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 16px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);border-left:5px solid var(--jade);text-align:left;min-width:0}
.sub-t[data-c="chinese"]{border-left-color:var(--plum)}
.sub-t[data-c="math"]{border-left-color:var(--warn)}
.sub-t b{font-family:var(--display);font-weight:600;font-size:1.15rem;letter-spacing:.04em}
.sub-t b{white-space:nowrap}
.sub-t span{color:var(--soft);font-size:.85rem;line-height:1.5;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec{font-family:var(--display);font-weight:600;font-size:1.35rem;margin:10px 4px 0;letter-spacing:.06em;scroll-margin-top:12px}
@media (hover:hover){.quick a:hover,.sub-t:hover{border-color:var(--jade)}.feat:hover .feat-go{background:var(--card);color:var(--jade);border-color:var(--card)}}
@media (max-width:700px){.portal{grid-template-columns:minmax(0,1fr)}.quick{grid-template-rows:none;grid-template-columns:repeat(3,minmax(0,1fr))}.quick a{grid-template-columns:minmax(0,1fr);padding:10px 12px}.quick a::after{display:none}.subs{grid-template-columns:repeat(3,minmax(0,1fr))}.sub-t{padding:10px 12px}.feat{padding:18px}.feat-t{font-size:1.6rem}}
@media (max-width:380px){.quick a,.sub-t{padding:10px 9px}.quick b,.sub-t b{letter-spacing:0}.quick b{font-size:1rem}.quick small{font-size:.78rem}}
@media (max-width:360px){.lockup{zoom:.88}}
.dlg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.dlg-box{background:var(--card);color:var(--ink);border-radius:20px;padding:22px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.dlg-box h2{margin:0;font-family:var(--display);font-weight:600;font-size:1.3rem}
.dlg-box img{width:220px;max-width:100%;border-radius:12px;background:#fff;padding:8px}
.dlg-box p{margin:0;color:var(--soft);font-size:.92rem}
.dlg-box .btn{flex:none;min-width:120px}

/* 知里 logo */
:root{--lg-tile:#1D5C4D;--lg-dot:#E07C9F;--lg-ink:#18302A;--lg-jade:#1D5C4D;--lg-plum:#B04A6F}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--lg-tile:#2C7A66;--lg-dot:#F29BBB;--lg-ink:#e8f1ee;--lg-jade:#7FD1B6;--lg-plum:#F29BBB} }
[data-theme="dark"]{--lg-tile:#2C7A66;--lg-dot:#F29BBB;--lg-ink:#e8f1ee;--lg-jade:#7FD1B6;--lg-plum:#F29BBB}
.lg-tile{fill:var(--lg-tile)}.lg-dot{fill:var(--lg-dot)}.lg-ink{fill:var(--lg-ink)}.lg-jade{fill:var(--lg-jade)}.lg-plum{fill:var(--lg-plum)}.lg-jades{stroke:var(--lg-jade)}
.brandbar{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;text-decoration:none;border-radius:10px;margin:0 0 4px}
.brandbar svg,.lockup svg{display:block;flex:none}
.brandbar:focus-visible{outline:2px solid var(--lg-jade);outline-offset:4px}
.lockup{display:flex;align-items:center;gap:18px;margin:4px 0 6px;font-size:0;line-height:0}
.lockup .col{display:flex;flex-direction:column;align-items:flex-start;gap:7px}
.lockup .col svg:last-child{margin-left:4px}
@media print{.brandbar,.lockup{display:none!important}}
</style>

<style id="zhili-theme">
/* learn-inside 统一风格：纸色底、深青、少量粉；标题用宋体 */
:root{--bg:#F6F4EE;--card:#FFFFFF;--ink:#18302A;--soft:#5E726C;--line:#E4E0D6;--jade:#1D5C4D;--jade-soft:#E3ECE7;--plum:#B04A6F;--plum-soft:#F6E7EC;--warn:#A85A2A;--warn-soft:#F6E9DD;
 --display:"Zhili Serif","Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif;

@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--bg:#121C19;--card:#1A2723;--ink:#E8EFEA;--soft:#9DB0A9;--line:#2B3B36;--jade:#6CC2A6;--jade-soft:#1E352F;--plum:#F29BBB;--plum-soft:#3E2630;--warn:#E3A274;--warn-soft:#3A2B1F;--lg-jade:#7FD1B6;--lg-sub:#A9C9BE;--lg-ink:#FFFFFF} }
:root[data-theme="dark"]{--bg:#121C19;--card:#1A2723;--ink:#E8EFEA;--soft:#9DB0A9;--line:#2B3B36;--jade:#6CC2A6;--jade-soft:#1E352F;--plum:#F29BBB;--plum-soft:#3E2630;--warn:#E3A274;--warn-soft:#3A2B1F;--lg-jade:#7FD1B6;--lg-sub:#A9C9BE;--lg-ink:#FFFFFF}
.lg-sub{fill:var(--lg-sub)}
/* 收一点可爱感：细边、去掉按钮底下的厚影子 */
.player,.maintabs,.tabs,.tools{border-width:1.5px!important;box-shadow:0 1px 3px rgba(0,0,0,.05)!important}
.player{border-radius:18px}
.nx,.rb.play,.btn.go,.tp,.half{box-shadow:none!important}
.card{border-top-width:3px}
#home a.card{border-width:1.5px}
h1{font-weight:600;letter-spacing:.06em}
.seal{background:transparent!important;color:var(--plum)!important;border:1.5px solid currentColor;border-radius:3px;font-family:var(--display)!important;font-weight:600}
.lockup{gap:20px}
.lockup .col{gap:11px}
.lockup .col svg:last-child{margin-left:0}
.brandbar{gap:9px;margin:0 0 6px}
.brandbar .bdiv{width:1.5px;height:12px;background:var(--lg-sub);opacity:.45;flex:none}
/* 自适应：手机、平板、电脑和各种窗口大小 */
body{font-size:1rem}
@media (min-width:768px){html{font-size:17px}}
@media (min-width:1200px){html{font-size:18px}}
@media (min-width:1700px){html{font-size:19.5px}}
@media (min-width:900px){.wrap{max-width:1000px}}
@media (min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}}
@media (min-width:1200px){.wrap{max-width:1180px}.lockup{zoom:1.15}}
@media (min-width:1700px){.wrap{max-width:1360px}.lockup{zoom:1.3}}

      <a href="math/#/graph"><b>知识图谱</b><small>看哪里薄弱</small></a>
      <a href="math/#/mistakes"><b>错题本</b><small>错题再练</small></a>
    </div>
  </section>

  <div class="foot">
    <span>learn-inside · 知里才知理</span>
    <button class="theme" id="theme">切换深色 / 浅色</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const store={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("theme").onclick=()=>{const dark=matchMedia("(prefers-color-scheme: dark)").matches,cur=document.documentElement.dataset.theme||(dark?"dark":"light"),nx=cur==="dark"?"light":"dark";document.documentElement.dataset.theme=nx;store.set("li-theme",nx)};
{const t=store.get("li-theme","");if(t)document.documentElement.dataset.theme=t}
/* 账号：已登录显示孩子昵称 */
{try{const st=JSON.parse(localStorage.getItem("li.student")||"null");if(st&&st.nickname){const n=String(st.nickname);$("me").innerHTML=`<span class="av">${esc(n.slice(0,1))}</span>${esc(n)} · 我的学习`}}catch(e){}}
/* 联系客服：后台上传的微信二维码 */
$("sup").onclick=async()=>{
  let s={qr:null,text:""};
  if(/^https?:$/.test(location.protocol)){try{s=await (await fetch("/api/support")).json()}catch(e){}}
  const qr=typeof s.qr==="string"&&/^(data:image\/|https:)/.test(s.qr)?s.qr:"";
  const d=document.createElement("div");d.className="dlg";
  d.innerHTML=`<div class="dlg-box" role="dialog" aria-label="联系客服"><h2>联系客服</h2>${qr?`<img src="${esc(qr)}" alt="客服微信二维码"><p>微信扫码添加客服</p>`:""}${s.text?`<p>${esc(String(s.text))}</p>`:qr?"":"<p>客服联系方式还没有设置。</p>"}<button class="btn go">好的</button></div>`;
  d.onclick=e=>{if(e.target===d||e.target.closest(".btn"))d.remove()};document.body.appendChild(d);
};
</script>
</body>
</html>
