<style>
/* 版式：一张对比表（行 = 用法，列 = 三个形象），下面是两个候选各自的表情动作 */
:root { --bg: #FBFAF6; --card: #FFFFFF; --ink: #18302A; --mute: #6B7A74; --line: #E4E0D4; --jade: #1D5C4D; --plum: #B04A6F;
  --sans: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-size: 15px; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.5; }
main { max-width: 860px; margin: 0 auto; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 36px; }
h1 { font-size: 1.7rem; margin: 0; letter-spacing: .02em; text-wrap: balance; }
h2 { font-size: 1.1rem; margin: 0 0 12px; display: flex; align-items: baseline; gap: 10px; }
h2 small { font-weight: 400; color: var(--mute); font-size: .85rem; }
.sub { color: var(--mute); margin: 6px 0 0; }
svg.mascot, svg.mascot-happy { display: block; width: 100%; height: auto; }
.cmp { display: grid; grid-template-columns: 3.2em repeat(3, minmax(0, 1fr)); align-items: end; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.cmp > * { padding: 14px 10px; border-top: 1px solid var(--line); }
.cmp > .hd { border-top: 0; text-align: center; font-weight: 700; align-self: stretch; padding-block: 12px; }
.cmp > .hd small { display: block; font-weight: 400; color: var(--mute); font-size: .78rem; }
.cmp > .hd.pick { color: var(--jade); }
.lab { align-self: stretch; display: flex; align-items: center; color: var(--mute); font-size: .82rem; }
.cell { display: flex; justify-content: center; align-items: flex-end; gap: 12px; align-self: stretch; }
.cell.full svg { max-width: 190px; }
.cell.head svg { max-width: 96px; }
.cell.tiny { align-items: center; }
.cell.tiny svg:nth-child(1) { width: 48px; } .cell.tiny svg:nth-child(2) { width: 30px; }
.cell.sil svg { max-width: 96px; filter: brightness(0); opacity: .82; }
.cell.dark { background: var(--jade); } .cell.dark svg { max-width: 84px; }
.lab.dark { background: var(--jade); color: #CFE3DB; }
.acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px 6px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 10px 12px; }
figure { margin: 0; text-align: center; }
figure svg { max-width: 150px; margin: 0 auto; }
figcaption { font-size: .85rem; color: var(--mute); margin-top: 2px; }
.v3 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 8px; align-items: end; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 12px 12px; }
.v3 img { display: block; width: 100%; height: auto; max-width: 200px; margin: 0 auto; }
.v3 .on { grid-column: 1 / -1; background: var(--jade); border-radius: 10px; display: flex; justify-content: center; align-items: flex-end; gap: 8%; padding: 14px 12px 6px; }
.v3 .on img { width: 30%; max-width: 170px; margin: 0; }
.v3 .on img.s { width: 13%; max-width: 70px; }
@media (max-width: 620px) { .v3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.v5 { display: grid; gap: 14px; }
.v5 .big { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 14px 14px; display: flex; justify-content: center; }
.v5 .big img { display: block; width: 100%; height: auto; max-width: 440px; }
.v5 .big.wide img { max-width: 560px; }
.v5 .v3.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.v5 .v3 img { max-width: 230px; }
.v2 { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; }
.v2 img, .poses img { display: block; width: 100%; height: auto; }
.v2 .hero { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 14px 10px; display: flex; align-items: flex-end; }
.v2 .side { display: grid; gap: 14px; grid-template-rows: minmax(0, 1fr) auto; }
.v2 .band { background: var(--jade); border-radius: 14px; padding: 16px 16px 8px; display: flex; align-items: flex-end; justify-content: center; }
.v2 .band img { max-width: 250px; }
.v2 .mini { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; display: flex; align-items: flex-end; justify-content: center; gap: 22px; }
.v2 .mini img:nth-child(1) { width: 104px; } .v2 .mini img:nth-child(2) { width: 68px; } .v2 .mini img:nth-child(3) { width: 42px; }
.poses { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 8px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 12px 12px; }
.poses figure img { max-width: 240px; margin: 0 auto; }
@media (max-width: 620px) { .v2 { grid-template-columns: minmax(0, 1fr); } .poses { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { h1 { font-size: 1.4rem; } .cmp > * { padding: 10px 4px; } .cell { gap: 6px; } }
</style>
</head>
