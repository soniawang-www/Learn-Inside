:root{
  --bg:#eaf3f1; --card:#ffffff; --ink:#1d2f3a; --soft:#5c7280; --line:#cfe0dc;
  --jade:#1f8a70; --jade-soft:#d6efe7; --plum:#c2377a; --plum-soft:#fbe3ee; --warn:#b3541e; --warn-soft:#fbe8da; --mine:#7a5cc2; --mine-soft:#ece5f8;
  --display:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
  --kai:"Kaiti SC","STKaiti","KaiTi",serif;
  --en:"Nunito","PingFang SC","Microsoft YaHei",sans-serif;
  --body:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12201f; --card:#1b2c2b; --ink:#e8f1ee; --soft:#9db3ae; --line:#2f4644;
  --jade:#5fd0b0; --jade-soft:#1f3d37; --plum:#ff8fc0; --plum-soft:#47253a; --warn:#ffb07a; --warn-soft:#472c1a; --mine:#b9a4ea; --mine-soft:#3a2f52; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12201f; --card:#1b2c2b; --ink:#e8f1ee; --soft:#9db3ae; --line:#2f4644;
  --jade:#5fd0b0; --jade-soft:#1f3d37; --plum:#ff8fc0; --plum-soft:#47253a; --warn:#ffb07a; --warn-soft:#472c1a; --mine:#b9a4ea; --mine-soft:#3a2f52; color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:400;font-size:2.3rem;margin:0;letter-spacing:.1em;display:flex;align-items:center;gap:10px;line-height:1.2}
h1 .seal{font-family:var(--kai);font-size:.85rem;letter-spacing:0;color:var(--card);background:var(--plum);border-radius:6px;padding:4px 0;width:1.9em;line-height:1.15;display:flex;flex-direction:column;align-items:center}
h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.3;text-wrap:balance}
h2{font-size:1.6rem;letter-spacing:.04em}
h3{font-size:1.2rem;color:var(--jade);letter-spacing:.04em;margin-top:4px}
p{margin:0}
.sub{color:var(--soft);font-family:var(--kai);font-size:1.02rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.9rem}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
.btn,.go{padding:8px 18px;border-radius:999px;background:var(--jade);color:var(--card);font-family:var(--display);font-size:1.05rem;letter-spacing:.04em;min-height:42px}
.btn.ghost,.ghost{padding:8px 16px;border-radius:999px;background:transparent;color:var(--jade);border:2px solid var(--jade);font-family:var(--display);font-size:1rem;min-height:42px}
.btn.plum{background:var(--plum)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

/* 语法配色 */
.en{font-family:var(--en);font-weight:700}
b.i{color:var(--plum);background:var(--plum-soft);padding:0 .28em;border-radius:6px;font-weight:800}
b.p{color:var(--jade);background:var(--jade-soft);padding:0 .28em;border-radius:6px;font-weight:800}
b.w{color:var(--warn);background:var(--warn-soft);padding:0 .28em;border-radius:6px;font-weight:800}
b.x{color:var(--plum);text-decoration:line-through;font-weight:800}
b.m{color:var(--mine);background:var(--mine-soft);padding:0 .28em;border-radius:6px;font-weight:800}
.ok{color:var(--jade);font-weight:800}
.cn{color:var(--soft);font-size:.9rem}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:800;font-size:.95rem}
.chip{padding:3px 12px;border-radius:999px;white-space:nowrap}
.chip.i{background:var(--plum-soft);color:var(--plum)}
.chip.p{background:var(--jade-soft);color:var(--jade)}
.chip.w{background:var(--warn-soft);color:var(--warn)}
.chip.m{background:var(--mine-soft);color:var(--mine)}

/* 两个大页签 */
.maintabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;border-radius:18px;background:var(--card);border:2px solid var(--jade);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 4px 12px -6px rgba(31,138,112,.35)}
.maintabs button{padding:8px;color:var(--jade);border-radius:12px;min-height:56px;display:flex;align-items:center;justify-content:center;gap:10px}
.maintabs .num{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-family:var(--display);font-size:1.1rem;line-height:1}
.maintabs b{font-family:var(--display);font-weight:400;font-size:1.4rem;letter-spacing:.12em}
.maintabs button[aria-selected="true"]{background:var(--jade);color:var(--card)}
.maintabs button:not([aria-selected="true"]):hover{background:var(--jade-soft)}

/* 章节条 */
.chaps{display:flex;flex-wrap:wrap;gap:8px}
.chaps button{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 6px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-size:.92rem;min-height:38px}
.chaps .n{width:24px;height:24px;border-radius:50%;background:var(--jade-soft);color:var(--jade);display:grid;place-items:center;font-family:var(--display);font-size:.95rem}
.chaps button[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:var(--card)}
.chaps button[aria-pressed="true"] .n{background:var(--card);color:var(--plum)}

/* 章节卡片 */
#learn,#prac{display:flex;flex-direction:column;gap:16px}
.chap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.kind{background:var(--bg);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;border-top:6px solid var(--line)}
.kind.zero{border-top-color:var(--jade)}
.kind.first{border-top-color:var(--warn)}
.kind h3{margin:0;color:var(--ink)}
.kind ul,.ex,.same{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.box{background:var(--jade-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.note{background:var(--plum-soft);border-radius:12px;padding:10px 14px;font-size:.95rem}
.three,.steps{margin:0;padding:0;list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:10px}
.three li,.steps li{counter-increment:r;position:relative;padding-left:36px}
.three li::before,.steps li::before{content:counter(r);position:absolute;left:0;top:2px;width:26px;height:26px;border-radius:50%;background:var(--plum);color:var(--card);display:grid;place-items:center;font-family:var(--display);font-size:.95rem}
.lead{color:var(--soft)}
#chaps,#level{scroll-margin-top:90px}
.fix .i{background:var(--plum-soft);color:var(--plum)}
.trap{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.trap li{background:var(--bg);border-left:5px solid var(--plum);border-radius:8px;padding:8px 12px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--jade-soft);color:var(--jade);font-weight:700}
.more{display:flex;flex-direction:column;gap:10px}
details{background:var(--bg);border-radius:12px;padding:2px 14px}
summary{cursor:pointer;font-family:var(--display);font-size:1.08rem;padding:8px 0;color:var(--jade)}
details>div{display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.lvl{font-size:.75rem;padding:1px 10px;border-radius:999px;background:var(--plum-soft);color:var(--plum);font-family:var(--body);vertical-align:middle;letter-spacing:0}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;border-top:1px dashed var(--line);padding-top:12px}
.src{font-size:.85rem;color:var(--soft)}
.src a,a.out{color:var(--jade)}

/* 连接词卡片 */
.word{background:var(--bg);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.word h3{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;color:var(--plum);font-family:var(--en);font-weight:800;font-size:1.25rem;letter-spacing:0}
.word h3 small{font-family:var(--body);font-weight:400;font-size:.92rem;color:var(--ink)}
.rel{font-size:.92rem;background:var(--card);border-radius:10px;padding:6px 10px}
.fam{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fam div{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:.92rem}
.fam strong{font-family:var(--display);font-weight:400;font-size:1.05rem;color:var(--jade)}
.fam .hub{background:var(--plum);color:var(--card)}
.fam .hub strong{color:var(--card)}

/* 动画舞台 */
.stage{background:var(--bg);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.stage .ttl{font-family:var(--display);color:var(--plum);font-size:1.05rem}
.scene{display:flex;align-items:center;justify-content:center;gap:14px;font-size:2.6rem;min-height:84px;line-height:1}
.scene small{font-size:.9rem;color:var(--soft);font-family:var(--body)}
.big{font-family:var(--en);font-weight:800;font-size:1.25rem;line-height:1.8}
.tog{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;font-size:.92rem;min-height:38px}
.tog[aria-pressed="true"]{background:var(--jade);color:var(--card);border-color:var(--jade)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row>span.lab{font-size:.88rem;color:var(--soft);min-width:4em}
@keyframes sunIn{0%{transform:translateX(-30px) scale(.7);opacity:.3}30%,100%{transform:none;opacity:1}}
@keyframes melt{0%,25%{transform:scale(1);opacity:1}75%,100%{transform:scale(.25);opacity:0}}
@keyframes drip{0%,35%{transform:scale(.2);opacity:0}80%,100%{transform:scale(1.2);opacity:1}}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
@keyframes fall{from{transform:translateY(-8px)}to{transform:translateY(8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
#sA .sun{animation:sunIn 4s ease-out infinite}
#sA .ice{animation:melt 4s ease-in infinite}
#sA .drop{animation:drip 4s ease-in infinite}
.pop{animation:pop .35s ease}
.wx{display:inline-block}
.wx.rain{animation:fall .6s ease-in-out infinite alternate}
.wx.sun{animation:spin 8s linear infinite}
/* will 搬家 */
.fix{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fix span{display:inline-block;padding:2px 8px;border-radius:8px;background:var(--card);transition:all .6s ease;white-space:nowrap}
.fix .bad{background:var(--plum-soft);color:var(--plum);max-width:5em;overflow:hidden}
.fix .good{background:var(--warn-soft);color:var(--warn);max-width:0;padding-inline:0;opacity:0;overflow:hidden;transform:translateY(-22px)}
.fix .v{background:var(--jade-soft);color:var(--jade)}
.fix.on .bad{max-width:0;padding-inline:0;opacity:0;transform:translateY(-22px)}
.fix.on .good{max-width:5em;padding-inline:8px;opacity:1;transform:none}
.fix .s2,.fix.on .s1{display:none}
.fix.on .s2{display:inline}
/* 先后顺序 */
.seq{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.95rem}
.seq span{background:var(--card);border-radius:10px;padding:4px 10px;opacity:.2;transition:opacity .4s}
.seq.play span{opacity:1}
.seq.play span:nth-child(2){transition-delay:.7s}
.seq.play span:nth-child(3){transition-delay:1.4s}
/* 开关表 */
.sw{display:flex;flex-direction:column;gap:6px}
.sw div{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--card);border-radius:10px;padding:6px 10px;min-width:0}
.sw .en{font-size:.95rem;min-width:0}
.pill{font-size:.85rem;padding:2px 12px;border-radius:999px;white-space:nowrap;font-weight:700}
.pill.y{background:var(--jade);color:var(--card)}
.pill.n{background:var(--line);color:var(--soft)}
/* 真实度滑块 */
.meter{height:14px;border-radius:999px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--jade);border-radius:999px;transition:width .5s ease,background .5s}
input[type=range]{width:100%;accent-color:var(--plum)}
.ticks{display:grid;grid-template-columns:repeat(4,1fr);font-size:.8rem;color:var(--soft);text-align:center}
@media (prefers-reduced-motion: reduce){
  #sA .sun,#sA .ice,#sA .drop,.wx.rain,.wx.sun,.pop{animation:none}
  .fix span,.seq span,.meter i{transition:none}
}
/* 句子机器 */
.machine{background:var(--bg);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.sentence{font-family:var(--en);font-size:1.3rem;font-weight:800;line-height:1.9;min-height:3.8em;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.cl{padding:2px 12px;border-radius:12px;background:var(--card);animation:pop .35s ease}
.cl.c-if{box-shadow:inset 0 0 0 2px var(--plum)}
.say{background:var(--card);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;font-size:.95rem}

/* 互动课播放器 */
#ref,#lesson{display:flex;flex-direction:column;gap:16px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.modes button{padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-family:var(--display);font-size:1.05rem;min-height:44px}
.modes button[aria-pressed="true"]{border-color:var(--plum);background:var(--plum-soft);color:var(--plum)}
.player{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.pprog{height:6px;background:var(--line)}
.pprog i{display:block;height:100%;background:var(--plum);transition:width .4s}
.scr{min-height:270px;padding:22px 14px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:var(--bg);position:relative}
.scr .big{font-size:1.45rem;line-height:2}
.scr .big>div{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.scr .formula{justify-content:center;font-family:var(--body);font-size:.9rem}
.scr .fix{justify-content:center}
.tp{font-family:var(--body);font-size:1rem;font-weight:400;padding:6px 16px;border-radius:999px;border:2px solid var(--plum);color:var(--plum);background:var(--card);min-height:40px}
.tp.on{background:var(--plum);color:var(--card)}
.half{font:inherit;padding:4px 12px;border-radius:12px;border:2px dashed var(--plum);background:var(--card);margin:3px}
.half.on{border-style:solid;background:var(--plum-soft)}
.slot{display:inline-block;min-width:2.2em;padding:0 8px;border-bottom:3px solid var(--plum);color:var(--plum)}
.turn{position:absolute;top:8px;right:10px;font-size:.8rem;background:var(--plum);color:var(--card);border-radius:999px;padding:2px 12px;animation:pulse 1.2s infinite}
.pno{position:absolute;top:8px;left:12px;font-size:.8rem;color:var(--soft);font-variant-numeric:tabular-nums}
@keyframes pulse{50%{transform:scale(1.08)}}
.cap{background:var(--ink);color:var(--bg);padding:12px 16px;font-size:1.05rem;line-height:1.7;min-height:5.4em}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px}
.ctl .btn,.ctl .ghost{min-height:40px;padding:6px 14px;font-size:.98rem}
.ctl .btn:disabled,.ctl .ghost:disabled{opacity:.4;cursor:default}
.wob{display:inline-block;animation:wob 1.2s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.melt{display:flex;gap:14px}
.melt .sun{animation:sunIn 4s ease-out infinite}.melt .ice{animation:melt 4s ease-in infinite}.melt .drop{animation:drip 4s ease-in infinite}
.sum{text-align:left;margin:0;padding-left:1.2em;font-family:var(--body);font-weight:400;font-size:1.05rem;line-height:2}
.fix i{font-style:normal}
.fix button.bad{padding:2px 8px;border-radius:8px;transition:all .6s ease;font:inherit;border:2px dashed var(--plum)}
@media (prefers-reduced-motion: reduce){.wob,.turn,.melt span{animation:none}}
/* 练习目录下拉 + 打印按钮 */
.ptools{display:flex;gap:8px;align-items:flex-start}
.ptools .lmenu{flex:1;min-width:0}
.ptools #pmName{min-width:0;font-size:1.15rem}
.ptools .lmenu summary em{padding:5px 12px}
.ptools .lmenu summary{min-height:68px}
@media (max-width:420px){.ptools #pmName small{display:block;margin-left:0}}
.ptools #pmName small{font-family:var(--body);font-size:.8rem;color:var(--soft);margin-left:8px;font-variant-numeric:tabular-nums}
.lmenu>.pl{gap:12px}
.prb{flex:none;width:68px;height:68px;padding:0;border-radius:16px;border:2px solid var(--plum);background:var(--card);color:var(--plum);font-family:var(--display);font-size:1.05rem;line-height:1.25;letter-spacing:.06em;box-shadow:0 3px 0 var(--plum-soft)}
.prb[aria-expanded="true"]{background:var(--plum);color:var(--card)}
/* 打印练习 */
#printArea{position:fixed;inset:0;z-index:40;overflow-y:auto;background:#fff;color:#000}
.pv-bar{position:sticky;top:0;z-index:1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:#eaf3f1;border-bottom:1px solid #cfe0dc;color:#1d2f3a}
.pv-bar .btn{background:#1f8a70;color:#fff;text-decoration:none;display:inline-flex;align-items:center}
.pv-bar .btn.plum{background:#c2377a}
.pv-bar .btn.ghost{background:#fff;color:#1f8a70;border-color:#1f8a70}
.pv-tip{flex-basis:100%;font-size:.9rem;line-height:1.6;display:flex;flex-direction:column;gap:6px}
.pv-save{display:flex;flex-wrap:wrap;gap:8px}
.pv-doc{padding:16px}
.pv-imgs{display:flex;flex-direction:column;gap:12px;align-items:center;background:#888}
.pv-imgs img{width:100%;max-width:720px;display:block;border:1px solid #cfe0dc;border-radius:6px}
.pv-link{flex-basis:100%;word-break:break-all;user-select:all;-webkit-user-select:all;background:#fff;border:1px solid #cfe0dc;border-radius:8px;padding:6px 8px;font-size:.8rem}
@page{size:A4;margin:15mm}
@media print{html,body{background:#fff!important;padding:0!important}body.printing>*:not(#printArea){display:none!important}#printArea{position:static!important;overflow:visible!important}.pv-bar{display:none!important}.pv-doc{padding:0}.sheet{max-width:none}}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pcard h3{margin:0;color:var(--plum)}
.pcard label{display:flex;gap:8px;align-items:center;font-size:.95rem}
.pcard input{width:20px;height:20px;accent-color:var(--plum);margin:0}
/* 练习 */
.tgs{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.tg{display:flex;flex-direction:column;gap:6px}
.tgl{font-family:var(--display);color:var(--plum);letter-spacing:.1em}
.tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tab{padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);text-align:left;display:flex;flex-direction:column;line-height:1.35;font-size:.95rem}
.tab small{color:var(--soft);font-size:.8rem;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{border-color:var(--jade);background:var(--jade-soft);box-shadow:inset 0 0 0 1px var(--jade)}
.lvhead{display:flex;flex-direction:column;gap:2px}
.lvhead h3{color:var(--ink);font-size:1.4rem}
.qs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:q}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;counter-increment:q}
.q.right{border-color:var(--jade);background:var(--jade-soft)}
.q.wrong{border-color:var(--plum)}
.qt{font-size:1.08rem;font-weight:700}
.qt::before{content:counter(q);display:inline-grid;place-items:center;width:24px;height:24px;margin-right:8px;border-radius:50%;background:var(--jade);color:var(--card);font-family:var(--display);font-weight:400;font-size:.9rem;vertical-align:2px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 16px;font-family:var(--en);font-weight:700;min-height:38px;text-align:left}
.opt:hover:not(:disabled){border-color:var(--jade)}
.opt:disabled{cursor:default;opacity:.7}
.opt.is-right{background:var(--jade);border-color:var(--jade);color:var(--card);opacity:1}
.opt.is-wrong{background:var(--plum-soft);border-color:var(--plum);color:var(--plum);opacity:1}
.q input{font:inherit;font-weight:700;width:9.5em;max-width:100%;padding:2px 10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.fb{border-radius:10px;padding:8px 12px;font-size:.95rem;font-family:var(--body);font-weight:400}
.fb.good{background:var(--card);color:var(--jade)}
.fb.bad,.fb.hint{background:var(--plum-soft);color:var(--plum)}
.fb span{color:var(--ink)}
.line,.pool{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;align-items:center}
.line{border-bottom:2px dashed var(--line);padding-bottom:6px}
.wd{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:3px 11px;font-family:var(--en);font-weight:700}
.line .wd{border-color:var(--plum);background:var(--plum-soft)}
.result{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-weight:700}
.stars{color:var(--plum);font-size:1.4rem;letter-spacing:2px}
@media (max-width:420px){ h1{font-size:1.85rem} .sentence{font-size:1.12rem} .big{font-size:1.1rem} }

/* ===== 互动课播放器（第二版外观） ===== */
#learn{gap:14px}
.lmenu{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 14px}
.lmenu summary{display:flex;align-items:center;gap:10px;list-style:none;padding:10px 0;color:var(--ink);font-size:1.3rem}
.lmenu summary::-webkit-details-marker{display:none}
.lmenu .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--plum);color:var(--card);display:grid;place-items:center;font-family:var(--display);font-size:1.05rem}
.lmenu summary em{margin-left:auto;font-style:normal;font-family:var(--display);font-size:1rem;letter-spacing:.04em;color:var(--card);background:var(--jade);border-radius:999px;padding:5px 14px;white-space:nowrap;box-shadow:0 3px 0 var(--jade-soft)}
.lmenu summary em::after{content:" ▾"}
.lmenu[open] summary em::after{content:" ▴"}
.lmenu>.llist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding-bottom:14px}
.llist button{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;border:2px solid var(--line);text-align:left;font-size:.95rem;min-height:44px}
.llist .n{width:24px;height:24px;font-size:.9rem;background:var(--jade-soft);color:var(--jade)}
.llist button[aria-pressed="true"]{border-color:var(--plum);background:var(--plum-soft)}
.llist button.done .n{background:var(--jade);color:var(--card)}
.player{border:2px solid var(--jade);border-radius:22px;box-shadow:0 6px 0 var(--jade-soft)}
.ptop{display:flex;align-items:center;gap:10px;padding:12px 14px 0;background:var(--card)}
.segs{flex:1;display:flex;gap:4px;min-width:0}
.segs i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.segs i.d{background:var(--jade)}
.segs i.c{background:var(--plum)}
#pNo{font-size:.8rem;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.vb{font-size:.8rem;padding:2px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--soft);white-space:nowrap;min-height:28px}
.vb[aria-pressed="true"]{border-color:var(--jade);color:var(--jade);background:var(--jade-soft)}
.scr{background:var(--card);min-height:310px;padding:40px 16px 24px}
.scr .big{font-size:1.5rem;line-height:1.9;width:100%}
.zh{display:block;font-family:var(--kai);font-weight:400;font-size:1.08rem;color:var(--soft);line-height:1.6;margin-top:6px}
.acts{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tp{border-width:2px;box-shadow:0 3px 0 var(--plum-soft);transition:transform .1s}
.tp:active,.half:active,.nx:active,.rb:active{transform:translateY(2px)}
.half{border:2px solid var(--plum);box-shadow:0 3px 0 var(--plum-soft);padding:6px 14px;margin:5px;line-height:1.5}
.wt{font:inherit;padding:2px 7px;border-radius:8px;border-bottom:3px dotted var(--line)}
.wt:hover{background:var(--plum-soft)}
.turn{top:10px;right:12px;font-family:var(--display);font-size:.85rem;padding:3px 14px}
.cap{background:var(--jade-soft);color:var(--ink);display:flex;gap:10px;align-items:flex-start;padding:12px 14px;min-height:5.8em;font-family:var(--kai);font-size:1.15rem;line-height:1.65}
.cap .who{flex:none;font-family:var(--display);font-size:.85rem;background:var(--jade);color:var(--card);border-radius:8px;padding:1px 8px;margin-top:4px}
.cap p{margin:0;min-width:0}
.ctl{justify-content:center;gap:16px;padding:14px 12px 16px}
.rb{width:46px;height:46px;border-radius:50%;border:2px solid var(--jade);color:var(--jade);display:grid;place-items:center;background:var(--card)}
.rb svg{width:22px;height:22px;fill:currentColor}
.rb.play{width:62px;height:62px;background:var(--plum);border-color:var(--plum);color:var(--card);box-shadow:0 4px 0 var(--plum-soft)}
.rb.play svg{width:30px;height:30px}
.rb:disabled{opacity:.35;cursor:default}
.nx{height:46px;padding:0 20px;border-radius:999px;background:var(--jade);color:var(--card);font-family:var(--display);font-size:1.08rem;box-shadow:0 4px 0 var(--jade-soft);white-space:nowrap}
.scr .sw{width:100%;text-align:left;font-size:1rem;line-height:1.5}
.scr .sw div{background:var(--bg)}
.scr .seq{justify-content:center;font-family:var(--body);font-weight:400}
.scr .seq span{background:var(--bg);opacity:1}
.scr .meter{width:70%;margin:10px auto 0}
.scr .fix span:not([class]){background:var(--bg)}
.words{font-family:var(--body);font-weight:400;font-size:.95rem;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.words span{padding:2px 12px;border-radius:999px;background:var(--bg)}
.lab{font-family:var(--body);font-weight:400;font-size:.85rem;color:var(--soft);display:block}
.scr table{font-family:var(--body);font-weight:400;font-size:.85rem;line-height:1.4;text-align:left}
.scr td,.scr th{padding:5px 7px}
</style>

<script>
const G1="单项练习",G2="整体练习";
const LEVELS=[
 {g:G1,name:"单项 1",sub:"主格",desc:"谁来做动作，放在句子最前面：I you he she it we they。",qs:[
  {t:"pick",q:"___ am a student.（我）",o:["You","I","He"],a:1,why:"我做主语用 I，还要大写。"},
  {t:"pick",q:"Tom is here. ___ is my friend.（他）",o:["He","Him","His"],a:0,why:"Tom 做主语，用主格 He。"},
  {t:"pick",q:"Lily and I are kids. ___ like games.（我们）",o:["Us","We","Them"],a:1,why:"我们做主语用 We。"},
  {t:"pick",q:"Look at the cat. ___ is cute.（它）",o:["It","Its","Him"],a:0,why:"动物、东西做主语用 It。"},
  {t:"pick",q:"___ runs fast.（她）",o:["Her","She","Hers"],a:1,why:"她做主语用 She。"},
  {t:"pick",q:"My friends are nice. ___ help me.（他们）",o:["Them","Their","They"],a:2,why:"他们做主语用 They。"},
  {t:"pick",q:"哪一个能放句首做主语？",o:["him","he","his"],a:1,why:"主格 he 才能做主语。"},
  {t:"pick",q:"___ are my teacher.（你）",o:["You","Your","Yours"],a:0,why:"你做主语用 You。"},
  {t:"fill",q:"___ (我) like music.",a:["I"],hint:"我，而且要大写。",why:"主格 I 永远大写。"},
  {t:"fill",q:"Dad is tall. ___ (他) plays basketball.",a:["He"],hint:"他做主语。",why:"用主格 He。"},
  {t:"pick",q:"哪一句对？",o:["Me am happy.","I am happy."],a:1,why:"做主语用 I。"},
  {t:"order",s:"They are my friends.",cn:"他们是我的朋友。",why:"They 做主语，放在最前面。"}
 ]},
 {g:G1,name:"单项 2",sub:"宾格",desc:"动作或介词后面：me you him her it us them。",qs:[
  {t:"pick",q:"Mom loves ___.（我）",o:["I","me","my"],a:1,why:"动作后面用宾格 me。"},
  {t:"pick",q:"Please help ___.（他）",o:["he","his","him"],a:2,why:"动作后面用 him。"},
  {t:"pick",q:"I see ___.（她）",o:["her","she","hers"],a:0,why:"动作后面用 her。"},
  {t:"pick",q:"Come with ___.（我们）",o:["we","us","our"],a:1,why:"介词 with 后面用 us。"},
  {t:"pick",q:"I know ___.（他们）",o:["they","them","their"],a:1,why:"动作后面用 them。"},
  {t:"pick",q:"Catch ___!（它）",o:["its","it","him"],a:1,why:"它的宾格还是 it。"},
  {t:"pick",q:"Give the book to ___.（你）",o:["you","your","yours"],a:0,why:"介词 to 后面用宾格 you。"},
  {t:"pick",q:"哪一句对？",o:["She likes he.","She likes him."],a:1,why:"动作后面用宾格 him。"},
  {t:"fill",q:"I miss ___ (她) a lot.",a:["her"],hint:"动作后面。",why:"宾格 her。"},
  {t:"fill",q:"Sit next to ___ (我).",a:["me"],hint:"介词 to 后面。",why:"宾格 me。"},
  {t:"pick",q:"哪一个是宾格？",o:["they","them","their"],a:1,why:"them 是宾格。"},
  {t:"order",s:"Can you help us?",cn:"你能帮我们吗？",why:"help 后面用宾格 us。"}
 ]},
 {g:G1,name:"单项 3",sub:"be 动词",desc:"I 用 am；he/she/it 用 is；you/we/they 用 are。",qs:[
  {t:"pick",q:"I ___ happy.",o:["is","am","are"],a:1,why:"I 配 am。"},
  {t:"pick",q:"She ___ kind.",o:["are","am","is"],a:2,why:"she 配 is。"},
  {t:"pick",q:"They ___ at school.",o:["are","is","am"],a:0,why:"they 配 are。"},
  {t:"pick",q:"It ___ a dog.",o:["are","is","am"],a:1,why:"it 配 is。"},
  {t:"pick",q:"You ___ my friend.",o:["is","are","am"],a:1,why:"you 配 are。"},
  {t:"pick",q:"We ___ ready.",o:["are","is","am"],a:0,why:"we 配 are。"},
  {t:"pick",q:"He ___ tall.",o:["are","am","is"],a:2,why:"he 配 is。"},
  {t:"pick",q:"I'm 是哪两个词的缩写？",o:["I are","I am","I is"],a:1,why:"I'm = I am。"},
  {t:"fill",q:"She ___ (be) my sister.",a:["is"],hint:"she 配哪个？",why:"she 配 is。"},
  {t:"fill",q:"We ___ (be) good friends.",a:["are"],hint:"we 配哪个？",why:"we 配 are。"},
  {t:"pick",q:"哪一句对？",o:["He are tall.","He is tall."],a:1,why:"he 配 is。"},
  {t:"order",s:"They are my classmates.",cn:"他们是我的同学。",why:"they 配 are。"}
 ]},
 {g:G1,name:"单项 4",sub:"my 我的＋东西",desc:"后面一定跟东西：my your his her its our their。",qs:[
  {t:"pick",q:"This is ___ book.（我的）",o:["mine","my","me"],a:1,why:"后面有 book，用 my。"},
  {t:"pick",q:"I like ___ hat.（她的）",o:["hers","she","her"],a:2,why:"后面有 hat，用 her。"},
  {t:"pick",q:"That is ___ dog.（他的）",o:["him","his","he"],a:1,why:"他的＋东西用 his。"},
  {t:"pick",q:"___ class is big.（我们的）",o:["Ours","Us","Our"],a:2,why:"后面有 class，用 our。"},
  {t:"pick",q:"The cat licks ___ tail.（它的）",o:["its","it's","it"],a:0,why:"它的用 its，没有撇号。"},
  {t:"pick",q:"___ toys are new.（他们的）",o:["Them","Their","Theirs"],a:1,why:"后面有 toys，用 their。"},
  {t:"pick",q:"Is this ___ pen?（你的）",o:["yours","your","you"],a:1,why:"后面有 pen，用 your。"},
  {t:"pick",q:"哪一句对？",o:["This is mine book.","This is my book."],a:1,why:"my 后面带东西。"},
  {t:"fill",q:"I love ___ (我的) family.",a:["my"],hint:"后面有 family。",why:"my＋东西。"},
  {t:"fill",q:"She lost ___ (她的) key.",a:["her"],hint:"后面有 key。",why:"her＋东西。"},
  {t:"pick",q:"哪一个后面一定要跟东西？",o:["mine","my","yours"],a:1,why:"my 后面一定跟东西。"},
  {t:"order",s:"Our teacher is kind.",cn:"我们的老师很友善。",why:"our＋teacher。"}
 ]},
 {g:G1,name:"单项 5",sub:"mine 单独用",desc:"后面不跟东西：mine yours his hers ours theirs。it 没有这种形式。",qs:[

/* ---------- 互动课：小工具 ---------- */
// 句子标记：{连接词} [从句动词] <主句动词>
const m=t=>t.replace(/<([^>]*)>/g,'<b class="w">$1</b>').replace(/\{([^}]*)\}/g,'<b class="i">$1</b>').replace(/\[([^\]]*)\]/g,'<b class="p">$1</b>').replace(/~([^~]*)~/g,'<b class="m">$1</b>');
const zh=t=>`<small class="zh">${t}</small>`;
const plain=h=>h.replace(/<small[\s\S]*?<\/small>/g,"").replace(/<div[\s\S]*$/,"").replace(/<[^>]+>/g,"").replace(/&nbsp;/g," ");
const tp=(label,k,v,on)=>`<button class="tp${on?" on":""}" data-k="${k}" data-v="${v}">${label}</button>`;
const hf=(label,k,v,on)=>`<button class="half${on?" on":""}" data-k="${k}" data-v="${v}">${label}</button>`;
const acts=h=>`<div class="acts">${h}</div>`;
const fml=(a,b)=>`<div class="formula"><span class="chip i">If</span><span class="chip p">${a}</span>,<span class="chip w">${b}</span></div>`;
const sum=a=>`<ul class="sum">${a.map(x=>`<li>${x}</li>`).join("")}</ul>`;
const words=a=>`<div class="words">${a.map(x=>`<span>${x}</span>`).join("")}</div>`;
// 讲一句
const info=(s,c,say)=>({html:m(s)+(c?zh(c):""),en:plain(m(s)),say});
// 几个按钮换着看：items = [按钮, 句子, 中文, 讲解]
const tabs=(key,items,ask,min)=>({
  html:s=>{const i=+(s[key]||0),it=items[i];return m(it[1])+zh(it[2])+acts(items.map((x,k)=>tp(x[0],key,k,k===i&&s.n)).join(""))},
  en:s=>s.n?plain(m(items[+(s[key]||0)][1])):"",
  say:s=>!s.n?ask:(items[+s[key]][3]||items[+s[key]][0]+"："+items[+s[key]][2]),
  need:s=>(s.n||0)>=(min||2)});
// 一个按钮来回切
const tog=(label,a,b,ask,sa,sb,min)=>({
  html:s=>(s.t==="1"?m(b[0])+zh(b[1]):m(a[0])+zh(a[1]))+acts(tp(label,"t","!")),
  en:s=>plain(m(s.t==="1"?b[0]:a[0])),
  say:s=>!s.n?ask:s.t==="1"?sb:sa,need:s=>(s.n||0)>=(min||1)});
// 填空三选一
const quiz=(pre,post,opts,ans,ask,why,hints)=>({
  html:s=>`${m(pre)} <span class="slot">${s.a||"?"}</span> ${m(post)}`+acts(opts.map(x=>tp(x,"a",x,s.a===x)).join("")),
  en:s=>s.a===ans?plain(m(pre))+" "+ans+" "+plain(m(post)):"",
  say:s=>!s.a?ask:s.a===ans?"对了！"+why:"再想想。"+((hints&&hints[s.a])||""),need:s=>s.a===ans});
// 两句选一句
const pick2=(a,b,ans,ask,yes,no)=>({
  html:s=>hf(a,"q","a",s.q==="a")+hf(b,"q","b",s.q==="b"),
  say:s=>!s.q?ask:s.q===ans?"对了！"+yes:"再想想。"+no,need:s=>s.q===ans});
// 找错：toks 里的数组 [错的, 对的] 是要改的地方
const fix=(toks,why,ask)=>{const bad=toks.findIndex(t=>Array.isArray(t));return{
  html:s=>toks.map((t,k)=>k===bad?(s.k==bad?(t[1]?`<b class="p pop">${t[1]}</b>`:""):`<button class="wt" data-k="k" data-v="${k}">${t[0]}</button>`):`<button class="wt" data-k="k" data-v="${k}">${t}</button>`).join(" "),
  en:s=>s.k==bad?toks.map(t=>Array.isArray(t)?t[1]:t).join(" "):"",
  say:s=>s.k==null?(ask||"这句话有一处错。把错的地方点出来。"):s.k==bad?"改好了。"+why:"不是这里，再找找。",need:s=>s.k==bad}};

    const bin=atob(cv.toDataURL("image/jpeg",.88).split(",")[1]),jpg=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)jpg[k]=bin.charCodeAt(k);
    const content="q "+PW+" 0 0 "+PH+" 0 0 cm /Im0 Do Q";
    offs[pid]=len;push(pid+" 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+PW+" "+PH+"] /Resources << /XObject << /Im0 "+iid+" 0 R >> >> /Contents "+cid+" 0 R >>\nendobj\n");
    offs[cid]=len;push(cid+" 0 obj\n<< /Length "+content.length+" >>\nstream\n"+content+"\nendstream\nendobj\n");
    offs[iid]=len;push(iid+" 0 obj\n<< /Type /XObject /Subtype /Image /Width "+cv.width+" /Height "+cv.height+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpg.length+" >>\nstream\n");
    push(jpg);push("\nendstream\nendobj\n")});
  const xref=len;let x="xref\n0 "+total+"\n0000000000 65535 f \n";
  for(let id=1;id<total;id++)x+=String(offs[id]).padStart(10,"0")+" 00000 n \n";
  push(x+"trailer\n<< /Size "+total+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF\n");
  return new Blob(parts,{type:"application/pdf"});
}
// 打印预览：盖在页面上。电脑点「打印」；手机点了没反应就「存成 PDF」（做法和飞花令练习馆一致）
const OFFLINE=!(window.claude&&window.claude.use);
const SHEET_FILE="pronouns";
if(!OFFLINE)(async()=>{try{dl=await window.claude.use("downloads")}catch(e){dl=null}})();
function closePreview(){$("printArea").hidden=true;$("printArea").innerHTML="";document.body.classList.remove("printing")}
// 生成一个能在浏览器里重新打开这张练习单的链接：#print-范围-组号-是否附答案
function printToken(){return "print-"+prScope+"-"+cur+"-"+($("prAns").checked?"a":"n")}
function browserUrl(){if(!/^https?:$/.test(location.protocol))return "";return location.href.split("#")[0]+"#"+printToken()}
function applyPrintToken(tok){
  const m=/^print-(cur|g1|g2|all)-(\d+)-([an])$/.exec(tok||"");if(!m||!LEVELS[+m[2]])return;
  prScope=m[1];cur=+m[2];$("prAns").checked=m[3]==="a";
  document.querySelectorAll("#prScope .tog").forEach(t=>t.setAttribute("aria-pressed",t.dataset.s===prScope));
  drawTabs();drawLevel();prInfo();showTab("prac");$("prBtn").click();
}
$("prBtn").onclick=()=>{
  const ix=prIdx(),ans=$("prAns").checked,name=(prScope==="cur"?SHEET_TITLE+"-"+LEVELS[cur].sub:SHEET_TITLE)+".pdf",a=$("printArea");
  a.innerHTML=`<div class="pv-bar"><button class="btn plum" id="pvPrint">打印</button><button class="btn plum" id="pvPdf">存成 PDF</button><button class="btn ghost" id="pvClose">返回</button><div class="pv-tip" id="pvTip">点「打印」没反应时，点「存成 PDF」保存文件，再拿去打印。</div></div><div class="pv-doc sheet">${sheetInner(ix,ans)}</div>`;
  a.hidden=false;a.scrollTop=0;document.body.classList.add("printing");
  const tip=$("pvTip");
  $("pvClose").onclick=closePreview;
  $("pvPrint").hidden=!OFFLINE;
  $("pvPrint").onclick=()=>{try{window.print()}catch(e){}};
  $("pvPdf").onclick=async()=>{const b=$("pvPdf");b.disabled=true;b.textContent="正在生成……";
    try{const canvases=sheetImages(ix,ans),pages=canvases.length,blob=makePdf(canvases);
      if(!OFFLINE){
        if(!dl)tip.textContent="这里不能保存文件。";
        else{try{await dl.save({filename:name,data:blob});tip.textContent=`已保存 ${pages} 页 PDF。`}catch(e){tip.textContent=e&&e.code==="declined"?"已取消，没有保存。":"这里暂时不能保存文件。"}}
      }else{
        // 保存方式：手机优先用系统分享；电脑优先直接下载到本地；嵌在 App 框里时再给图片兜底
        const file=typeof File==="function"?new File([blob],name,{type:"application/pdf"}):null;
        const canShare=!!(file&&navigator.canShare&&navigator.share&&navigator.canShare({files:[file]}));
        const isMobile=/Android|iPhone|iPad|iPod|HarmonyOS|Mobile/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
        let inFrame=true;try{inFrame=window.self!==window.top}catch(e){}
        tip.innerHTML="";
        const head=document.createElement("div");head.textContent=`已生成 ${pages} 页 PDF：`;
        const box=document.createElement("div");box.className="pv-save";
        const note=document.createElement("div");
        const shareBtn=cls=>{const sh=document.createElement("button");sh.className="btn "+cls;sh.textContent="分享 / 存到本地";
          sh.onclick=async()=>{try{await navigator.share({files:[file],title:SHEET_TITLE})}catch(e){if(e&&e.name!=="AbortError")sh.textContent="这个浏览器不能分享文件"}};return sh};
        // 下载用英文文件名：部分浏览器遇到中文文件名会丢掉 .pdf 后缀
        const d0=new Date(),dlName=SHEET_FILE+"-"+d0.getFullYear()+String(d0.getMonth()+1).padStart(2,"0")+String(d0.getDate()).padStart(2,"0")+".pdf";
        const saveBtn=cls=>{const sv=document.createElement("button");sv.className="btn "+cls;sv.textContent="保存到本地";
          sv.onclick=()=>{try{const u=URL.createObjectURL(blob),l=document.createElement("a");l.href=u;l.download=dlName;l.rel="noopener";
            document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);
            note.textContent=`已开始下载「${dlName}」，在浏览器的下载列表或「下载」文件夹里可以找到。没看到的话，可能是浏览器拦截了下载。`}
            catch(e){note.textContent="这个浏览器不允许保存文件。"}};return sv};
        if(!isMobile){box.appendChild(saveBtn("plum"));note.textContent="点「保存到本地」，PDF 会下载到电脑的「下载」文件夹，打开后就可以打印。"}
        else if(canShare){box.appendChild(shareBtn("plum"));note.textContent="点「分享 / 存到本地」，可以选「存储到文件」、发到微信，或直接选「打印」。"}
        if(inFrame&&(isMobile?!canShare:true)){
          // 嵌在 App 框里时，下载和分享常被拦截：把练习单转成图片，长按或右键都能保存
          if(isMobile)head.textContent="这个页面是嵌在 App 里打开的，不能直接保存文件。练习单已经转成图片，放在下面了：";
          note.textContent=(isMobile?"长按图片，选「保存图片」或「存储到相册」，再打印或发给别人。":"如果点「保存到本地」没有反应，可以在下面的图片上点右键，选「图片另存为」。")+`共 ${pages} 页。`;
          const doc=a.querySelector(".pv-doc");doc.className="pv-doc pv-imgs";doc.textContent="";
          canvases.forEach((cv,i)=>{const img=document.createElement("img");img.src=cv.toDataURL("image/png");img.alt=`练习单第 ${i+1} 页`;doc.appendChild(img)});
        }else if(isMobile&&!canShare){
          const url=browserUrl();
          head.textContent="这个浏览器不能直接保存 PDF。在 App 或微信里打开时常会这样，换到手机浏览器里就可以保存。";
          box.appendChild(saveBtn("ghost"));
          if(url){
            const op=document.createElement("button");op.className="btn plum";op.textContent="用浏览器打开";
            op.onclick=()=>{let w=null;try{w=window.open(url,"_blank")}catch(e){}if(!w)note.textContent="没能自动跳转。请点右上角「···」，选「在浏览器打开」，再生成 PDF；或复制下面的链接，粘贴到浏览器里。"};
            box.insertBefore(op,box.firstChild);
            const cp=document.createElement("button");cp.className="btn ghost";cp.textContent="复制链接";
            const showLink=()=>{const s=document.createElement("div");s.className="pv-link";s.textContent=url;box.appendChild(s);cp.textContent="长按上面的链接复制"};
            cp.onclick=()=>{try{navigator.clipboard.writeText(url).then(()=>{cp.textContent="已复制"},showLink)}catch(e){showLink()}};
            box.appendChild(cp);
            note.textContent="可以先试「保存到本地」；不行的话点「用浏览器打开」，在浏览器里再点「存成 PDF」。如果没有跳转，请点右上角「···」选「在浏览器打开」。";
          }else note.textContent="可以先试「保存到本地」；不行的话，请用 Safari、Chrome 或手机自带浏览器打开这个文件，再生成 PDF。";
        }
        tip.appendChild(head);tip.appendChild(box);tip.appendChild(note);
      }
    }catch(e){tip.textContent="生成 PDF 没有成功，请换个浏览器再试。"}
    b.disabled=false;b.textContent="存成 PDF"};
};
document.head.appendChild(Object.assign(document.createElement("style"),{textContent:SHEET_CSS}));


/* ---------- 练习目录 ---------- */
function drawTabs(){
  const box=$("tabs");box.innerHTML="";
  $("pmNo").textContent=cur+1;$("pmName").innerHTML=`${LEVELS[cur].sub}<small>${S[cur].filter(x=>x.ok).length} / ${LEVELS[cur].qs.length}</small>`;
  [G1,G2].forEach(g=>{
    const h=document.createElement("div");h.className="tg";h.innerHTML=`<span class="tgl">${g}</span>`;
    const r=document.createElement("div");r.className="tabs";r.setAttribute("role","tablist");
    LEVELS.forEach((l,k)=>{
      if(l.g!==g)return;
      const ok=S[k].filter(x=>x.ok).length;
      const b=document.createElement("button");b.className="tab";b.setAttribute("role","tab");
      b.setAttribute("aria-selected",k===cur);
      b.innerHTML=`${l.sub}<small>${l.name} · ${ok} / ${l.qs.length}</small>`;
      b.onclick=()=>{cur=k;$("pmenu").open=false;drawTabs();drawLevel();prInfo()};
      r.appendChild(b);
    });
    h.appendChild(r);box.appendChild(h);
  });
}
/* ---------- 练习引擎 ---------- */
const S=LEVELS.map(l=>l.qs.map(()=>({done:false,ok:false,tries:0})));
let cur=0;
const norm=s=>s.toLowerCase().replace(/[’‘`]/g,"'").replace(/\s+/g,' ').trim().replace(/[.。]$/,'');
const blank=q=>q.replace('___','<span style="letter-spacing:-1px">＿＿＿</span>');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function finish(L,i,ok,el,q){
  const st=S[L][i];st.done=true;st.ok=ok;
  el.classList.add(ok?'right':'wrong');
  const fb=el.querySelector('.fb');
  fb.className='fb '+(ok?'good':'bad');
  const ans=q.t==='pick'?q.o[q.a]:q.t==='fill'?q.a[0]:q.s;
  fb.innerHTML=(ok?'<strong>对了！</strong> ':`<strong>正确答案：${ans}</strong><br>`)+`<span>${q.why}</span>`;
  fb.hidden=false;
  el.querySelectorAll('button,input').forEach(x=>x.disabled=true);
  drawTabs();drawResult();
}
function retry(el,msg){
  const fb=el.querySelector('.fb');fb.className='fb hint';fb.innerHTML='<strong>再想一想：</strong>'+msg;fb.hidden=false;
}
function drawResult(){
  const L=cur,st=S[L],box=document.getElementById('result');if(!box)return;
  const done=st.filter(x=>x.done).length,ok=st.filter(x=>x.ok).length,n=st.length;
  let h=`<span>已做 ${done} / ${n}，答对 ${ok} 题</span>`;
  if(done===n){
    const r=ok/n,stars=r===1?3:r>=.8?2:r>=.6?1:0;
    h+=`<span class="stars" aria-label="${stars} 颗星">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</span>`;
    h+=`<span>${r===1?'全对，这一关过了！':ok<n?'读一读红色题目的解释，再重做错题。':''}</span>`;
  }
  box.innerHTML=h;
  if(st.some(x=>x.done&&!x.ok)){
    const b=document.createElement('button');b.className='go';b.textContent='重做错题';
    b.onclick=()=>{st.forEach(x=>{if(x.done&&!x.ok){x.done=false;x.tries=0}});drawTabs();drawLevel()};
    box.appendChild(b);
  }
  if(done>0){
    const b=document.createElement('button');b.className='ghost';b.textContent='这一关全部重做';
    b.onclick=()=>{st.forEach(x=>{x.done=false;x.ok=false;x.tries=0});drawTabs();drawLevel()};
    box.appendChild(b);
  }
}
function drawLevel(){
  const L=cur,lv=LEVELS[L],host=document.getElementById('level');
  host.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px"><div class="lvhead"><h3>${lv.name}：${lv.sub}</h3><span class="cn">${lv.desc}</span></div><ol class="qs"></ol><div class="result" id="result"></div></div>`;
  const ol=host.querySelector('.qs');
  lv.qs.forEach((q,i)=>{
    const st=S[L][i],li=document.createElement('li');li.className='q';
    if(q.t==='pick'){
      li.innerHTML=`<div class="qt en">${blank(q.q)}</div><div class="opts"></div><div class="fb" hidden></div>`;
      q.o.forEach((o,k)=>{
        const b=document.createElement('button');b.className='opt';b.textContent=o;
        b.onclick=()=>{b.classList.add(k===q.a?'is-right':'is-wrong');
          if(k!==q.a)li.querySelectorAll('.opt')[q.a].classList.add('is-right');
          finish(L,i,k===q.a,li,q)};
        li.querySelector('.opts').appendChild(b);
      });
      if(st.done){li.querySelectorAll('.opt')[q.a].classList.add('is-right');finish(L,i,st.ok,li,q)}
    }else if(q.t==='fill'){
      const id=`q-${L}-${i}`;
      li.innerHTML=`<div class="qt en"><label for="${id}">${q.q.replace('___',`</label><input id="${id}" autocomplete="off" autocapitalize="off" spellcheck="false"><label for="${id}">`)}</label></div><div><button class="go">检查</button></div><div class="fb" hidden></div>`;
      const inp=li.querySelector('input');
      const check=()=>{
        const v=norm(inp.value);if(!v)return;
        if(q.a.some(a=>norm(a)===v)){finish(L,i,true,li,q)}
        else if(++st.tries<2){retry(li,q.hint)}
        else finish(L,i,false,li,q);
      };
      li.querySelector('.go').onclick=check;
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')check()});
      if(st.done){inp.value=q.a[0];finish(L,i,st.ok,li,q)}
    }else{
      const words=q.s.split(' ');let pool;
      do{pool=shuffle(words.map((w,k)=>({w,k})))}while(pool.every((p,k)=>p.k===k));
      let picked=[];
      li.innerHTML=`<div class="qt">把单词排成句子：<span class="cn">${q.cn}</span></div><div class="line en" aria-label="你的句子"></div><div class="pool en"></div><div><button class="go">检查</button></div><div class="fb" hidden></div>`;
      const line=li.querySelector('.line'),pl=li.querySelector('.pool');
      const paint=()=>{
        line.innerHTML='';pl.innerHTML='';
        picked.forEach((p,k)=>{const b=document.createElement('button');b.className='wd';b.textContent=p.w;
          b.onclick=()=>{picked.splice(k,1);paint()};line.appendChild(b)});
        pool.filter(p=>!picked.includes(p)).forEach(p=>{const b=document.createElement('button');b.className='wd';b.textContent=p.w;
          b.onclick=()=>{picked.push(p);paint()};pl.appendChild(b)});
      };
      paint();
      li.querySelector('.go').onclick=()=>{
        if(picked.length<words.length){retry(li,'先把所有单词都用上。');return}
        if(picked.map(p=>p.w).join(' ')===q.s){finish(L,i,true,li,q)}
        else if(++st.tries<2){retry(li,'大写字母开头的词放最前面；带逗号的词在前一半的最后。')}
        else finish(L,i,false,li,q);
      };
      if(st.done){picked=words.map((w,k)=>pool.find(p=>p.k===k));paint();finish(L,i,st.ok,li,q)}
    }
    ol.appendChild(li);
  });
  drawResult();
}
drawTabs();drawLevel();


prInfo();
{const h=location.hash.slice(1);if(/^print-/.test(h))setTimeout(()=>applyPrintToken(h),50)}
</script>
