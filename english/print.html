<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<title>打印 · learn-inside 英语</title>
<style>html,body{margin:0;background:#EDEAE2;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.msg{max-width:520px;margin:60px auto;padding:0 20px;color:#5D6A65;line-height:1.7;text-align:center}.msg a{color:#1D5C4D}</style>
</head>
<body>
<p class="msg" id="msg">正在准备…</p>
<script type="module">
// 打印链接页（不用登录）：#t=打印凭证&o=选项 → 统一打印预览；#phrases → 句型和名言
import { openEnglishPrint, openPhrasesPrint, unpackOpts } from './print-tpl.js?v=20261111u';
const H = new URLSearchParams(location.hash.slice(1));
const msg = (t) => { document.getElementById('msg').innerHTML = t; };
(async () => {
  try {
    if (H.has('phrases')) { msg(''); return openPhrasesPrint({ standalone: true, home: '/english/' }); }
    const t = H.get('t'); if (!t) throw new Error('打印链接不完整');
    const r = await fetch(`/api/print/${encodeURIComponent(t)}`); const d = await r.json();
    if (!r.ok) throw new Error(d.error || '打印链接已失效');
    const items = d.items || []; if (!items.length) throw new Error('没有要打印的题目');
    const opts = { v: d.v, ...unpackOpts(H.get('o')) };
    msg('');
    openEnglishPrint({
      name: 'ESDP', items, opts, standalone: true, home: '/english/#/esdp',
      presets: [{ label: `这次的 ${items.length} 题`, ids: () => items.map((x) => x.id) }],
      fetch: async (ids) => items.filter((x) => ids.includes(x.id)),
      link: async () => location.href,
    });
  } catch (e) { msg(`${e.message}<br><a href="/english/#/esdp">回到英语</a>`); }
})();
</script>
</body>
</html>
