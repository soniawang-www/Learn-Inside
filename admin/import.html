<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>题库导入</title>
  <link rel="stylesheet" href="/math/style.css">
</head>
<body>
  <div class="page" style="max-width:640px">
    <h1>题库导入</h1>
    <div class="card">
      <p class="small muted">选择私有仓库 <code>math-data</code> 里的 JSON 文件导入：<code>exams/</code> 下各考试文件夹里的试卷，和 <code>knowledge/units.json</code>（知识项体系：模块、知识项、前置关系、题型、识别信号）。导入 units.json 会整体替换前置关系，并删除不在里面的旧知识点；之后所有学生的画像按新考点重算。可以一次多选，反复导入不影响孩子的作答记录。建议先导入 units.json，再导入试卷（也可以一起选）。</p>
      <label class="field"><span>管理员密钥（ADMIN_KEY）</span><input type="text" id="key" autocomplete="off" spellcheck="false"></label>
      <label class="field"><span>文件（可多选）</span><input type="file" id="files" accept=".json,application/json" multiple></label>
      <div id="preview" class="small"></div>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="go" disabled>导入</button></div>
      <pre id="out" class="small" style="white-space:pre-wrap;margin-top:14px"></pre>
    </div>
    <p class="small muted"><a href="/admin/">← 管理后台</a> · <a href="/math/">数学</a></p>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  let exams = [], points = [], edges = null;
  try { $('key').value = sessionStorage.getItem('amc8.adminKey') || ''; } catch {}
  $('files').onchange = async () => {
    exams = []; points = []; edges = null; const lines = [];
    for (const f of $('files').files) {
      try {
        const d = JSON.parse(await f.text());
        if (Array.isArray(d.points)) {
          points.push(...d.points);
          if (Array.isArray(d.edges)) edges = d.edges;
          lines.push(`✓ ${f.name}：知识项 ${d.points.filter((p) => p.parent).length} 个、模块 ${d.points.filter((p) => !p.parent).length} 个（识别信号 ${d.points.filter((p) => p.signals?.length).length}，前置关系 ${d.edges ? d.edges.length : '—'}）${d.edges ? '，会删除不在这个文件里的旧知识点' : ''}`);
        } else if (d.id && Array.isArray(d.problems)) {
          exams.push(d);
          lines.push(`✓ ${f.name}：${d.title}（${d.problems.length} 题，答案 ${d.problems.map((p) => p.answer).join(d.problems.some((p) => !Object.keys(p.choices || {}).length) ? ' ' : '')}，互动解析 ${d.problems.filter((p) => p.advanced).length} 题）`);
        } else throw new Error('不是试卷或知识点文件');
      } catch (e) { lines.push(`✗ ${f.name}：${e.message}`); }
    }
    $('preview').textContent = lines.join('\n');
    $('preview').style.whiteSpace = 'pre-wrap';
    $('go').disabled = !exams.length && !points.length;
  };
  $('go').onclick = async () => {
    const key = $('key').value.trim();
    try { sessionStorage.setItem('amc8.adminKey', key); } catch {}
    $('go').disabled = true;
    // 一次一个请求：知识点先导，试卷一套一套导（一次全发太大，服务器会中断连接）；最后一个请求再重算画像
    const jobs = [];
    if (points.length) jobs.push({ label: '知识点', body: { knowledge: { points, edges, prune: !!edges } } });
    for (const e of exams) jobs.push({ label: e.title || e.id, body: { exams: [e] } });
    const out = []; let ok = 0;
    const show = (tail = '') => { $('out').style.whiteSpace = 'pre-wrap'; $('out').textContent = out.join('\n') + tail; };
    for (let i = 0; i < jobs.length; i++) {
      const j = jobs[i], last = i === jobs.length - 1;
      show(`\n导入中（${i + 1} / ${jobs.length}）：${j.label}…`);
      try {
        const r = await fetch('/math/api/admin/import', { method: 'POST', headers: { 'content-type': 'application/json', 'x-admin-key': key }, body: JSON.stringify({ ...j.body, recompute: last }) });
        const d = await r.json().catch(() => ({ error: `服务器返回 ${r.status}` }));
        if (!r.ok) { out.push(`✗ ${j.label}：${d.error}`); if (r.status === 403) break; continue; }
        ok++;
        out.push(`✓ ${[d.points ? `知识点 ${d.points} 个` : '', d.pruned ? `删除旧知识点 ${d.pruned} 个` : '', ...(d.exams || []), d.recomputed ? `重算了 ${d.recomputed} 个学生的画像` : ''].filter(Boolean).join('、') || j.label}`);
      } catch (e) { out.push(`✗ ${j.label}：${e.message}（网络中断，可以只选这个文件再试一次）`); }
    }
    show(`\n完成：成功 ${ok} / ${jobs.length}`);
    $('go').disabled = false;
  };
</script>
</body>
</html>
